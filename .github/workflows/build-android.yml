name: Build Android (.apk)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah tersedia di runner GitHub (ANDROID_HOME)
      - name: Cek Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Siapkan proyek Capacitor
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node prepare.js
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../KLM-Mix-HP.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLM-Mix-Android
          path: KLM-Mix-HP.apk
          if-no-files-found: error

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KLM-Mix-HP.apk
