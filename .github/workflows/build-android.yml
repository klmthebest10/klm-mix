name: Build Android (.apk)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # rilis = push tag v*  ATAU  commit ke main yang pesannya memuat [rilis] (tag dibuat di repo rilis)
      - name: Mode rilis?
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$MSG" == *"[rilis]"* ]]; }; then echo "RELEASE=1" >> "$GITHUB_ENV"; echo "RILIS v$V"; else echo "RELEASE=0" >> "$GITHUB_ENV"; echo "bukan rilis"; fi

      # Android SDK sudah tersedia di runner GitHub (ANDROID_HOME)
      - name: Cek Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Siapkan proyek Capacitor
        working-directory: mobile
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
        run: |
          npm install --no-audit --no-fund
          node prepare.js
          npx cap add android
          node patch-android.js
          npx cap sync android

      # kunci tanda tangan APK yang SELALU sama (secret) → APK baru bisa dipasang menimpa versi lama (update)
      - name: Kunci tanda tangan APK
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "kunci tetap dipakai"; else echo "::warning::secret ANDROID_DEBUG_KEYSTORE kosong — APK ditandatangani kunci sementara (tidak bisa update menimpa)"; fi

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../KLM-HP.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs ../../KLM-HP.apk | head -3
          grep -o 'versionCode [0-9]*\|versionName "[^"]*"' app/build.gradle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLM-Android
          path: KLM-HP.apk
          if-no-files-found: error

      - name: Publish release (tag v*)
        if: env.RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || 'klmthebest10/klm-releases' }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: KLM v${{ env.VERSION }}
          files: KLM-HP.apk
