name: Build Windows (.exe)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # tanda tangan kode (opsional) — lihat docs/SIGNING.md. Tanpa secret ini, build tetap jalan tanpa tanda tangan.
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # rilis = push tag v*  ATAU  commit ke main yang pesannya memuat [rilis] (tag dibuat di repo rilis)
      - name: Mode rilis?
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$MSG" == *"[rilis]"* ]]; }; then echo "RELEASE=1" >> "$GITHUB_ENV"; echo "RILIS v$V"; else echo "RELEASE=0" >> "$GITHUB_ENV"; echo "bukan rilis"; fi
          # [beta] = versi uji (pra-rilis GitHub, versi mis. 1.18.0-beta.1): hanya diterima KLM yang mencentang "Ikut versi uji"
          if [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$MSG" == *"[beta]"* ]] && [[ "$V" == *-* ]]; then echo "RELEASE=1" >> "$GITHUB_ENV"; echo "PRERELEASE=1" >> "$GITHUB_ENV"; echo "VERSI UJI v$V"; fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Electron ≥ 42 tidak lagi mengunduh dirinya saat npm install → unduh biner untuk uji (node_modules/electron/dist/electron.exe)
      - name: Unduh biner Electron
        shell: pwsh
        run: |
          npx --no-install install-electron --no
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { node node_modules/electron/install.js }
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { throw "electron.exe tidak terunduh" }
          node -e "console.log('Electron', require('electron/package.json').version)"

      # sumber update di dalam aplikasi: repo ini, atau repo rilis publik terpisah (variabel RELEASE_REPO, mis. "akun/klm-releases")
      - name: Sumber update aplikasi
        run: node build/release-tools.js repo "${{ vars.RELEASE_REPO }}"

      # Model segmentasi orang (MediaPipe Selfie Segmenter, Apache-2.0) untuk Latar AI — ikut dipaketkan agar jalan tanpa internet
      - name: Unduh model Latar AI
        shell: pwsh
        run: |
          $u = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"
          Invoke-WebRequest -Uri $u -OutFile web/selfie_segmenter.tflite -MaximumRetryCount 3 -RetryIntervalSec 5
          $f = Get-Item web/selfie_segmenter.tflite
          Write-Host ("model: {0:N0} KB" -f ($f.Length / 1KB))
          if ($f.Length -lt 100000) { Write-Host "::error::model segmentasi tidak terunduh"; exit 1 }
          Get-ChildItem node_modules/@mediapipe/tasks-vision/wasm | ForEach-Object { Write-Host ("{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)) }

      # Host plugin VST asli (klm-vsthost.exe) dibangun dengan VST 3 SDK (lisensi MIT) + plugin uji KLM Test Gain
      - name: Build host VST (VST3 SDK 3.8.1)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          git -C "$env:RUNNER_TEMP\vst3sdk" submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S native/vsthost -B native/vsthost/build -A x64 -DVST3_SDK="$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build native/vsthost/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem native/vsthost/build/bin/Release | ForEach-Object { Write-Host ("{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)) }
          Get-ChildItem -Recurse native/vsthost/build/KLMTestGain.vst3 | ForEach-Object { Write-Host $_.FullName }

      # Suara PC tanpa suara KLM (WASAPI process loopback) untuk Miracast / tangkap layar
      - name: Build helper suara PC (klm-procaudio)
        shell: pwsh
        run: |
          cmake -S native/procaudio -B native/procaudio/build -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build native/procaudio/build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item native/procaudio/build/Release/klm-procaudio.exe | ForEach-Object { Write-Host ("klm-procaudio.exe: {0:N0} KB" -f ($_.Length / 1KB)) }
          $o = & native/procaudio/build/Release/klm-procaudio.exe 2>&1; Write-Host "tanpa argumen: $o"
          $global:LASTEXITCODE = 0

      # Penerima AirPlay (klm-airplay.exe, GPL-3.0) dari pustaka UxPlay — iPhone/iPad/Mac mirroring tanpa aplikasi
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            make
            diffutils

      - name: Build penerima AirPlay (UxPlay lib, MSYS2 UCRT64)
        shell: msys2 {0}
        run: |
          set -e
          UX="$(cygpath -u "$RUNNER_TEMP")/uxplay"
          git clone https://github.com/FDH2/UxPlay.git "$UX"
          git -C "$UX" checkout 05b0275cb1b726592700e47a6e0307544b3d3a52
          # libavcodec minimal (FFmpeg 7.1, LGPL) khusus dekoder AAC/ALAC untuk suara iPhone — statis, kecil
          FFS="$(cygpath -u "$RUNNER_TEMP")/ffsrc"; FFP="$(cygpath -m "$RUNNER_TEMP")/ffmin"
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git "$FFS"
          (cd "$FFS" && ./configure --prefix="$FFP" --disable-everything --enable-decoder=aac,alac --disable-programs --disable-doc \
            --enable-static --disable-shared --disable-avformat --disable-swscale --disable-avfilter --disable-avdevice --disable-swresample \
            --disable-network --disable-autodetect --disable-iconv --disable-x86asm --disable-debug && make -j4 && make install)
          export PKG_CONFIG_PATH="$(cygpath -u "$RUNNER_TEMP")/ffmin/lib/pkgconfig:$PKG_CONFIG_PATH"
          pkg-config --modversion libavcodec
          cmake -S native/airplay -B native/airplay/build -G Ninja -DUXPLAY_DIR="$(cygpath -m "$UX")" -DCMAKE_BUILD_TYPE=Release
          grep -q "HAVE_AVCODEC" native/airplay/build/build.ninja || { echo "::error::klm-airplay dibangun tanpa suara"; exit 1; }
          cmake --build native/airplay/build
          mkdir -p native/airplay/dist
          cp native/airplay/build/klm-airplay.exe native/airplay/dist/
          strip native/airplay/dist/klm-airplay.exe || true
          ldd native/airplay/dist/klm-airplay.exe | awk '/\/ucrt64\//{print $3}' | sort -u | while read d; do cp "$d" native/airplay/dist/; done
          cp "$UX/LICENSE" native/airplay/dist/COPYING-GPL3.txt
          cp "$FFS/COPYING.LGPLv2.1" native/airplay/dist/COPYING-FFmpeg-LGPL2.1.txt
          cp native/airplay/README.md native/airplay/dist/README.txt
          ls -la native/airplay/dist

      - name: Uji penerima AirPlay (berjalan tanpa MSYS2, mengumumkan layanan)
        shell: pwsh
        run: |
          $exe = "native/airplay/dist/klm-airplay.exe"
          $v = & $exe --version
          Write-Host $v
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::klm-airplay.exe tidak bisa dijalankan (DLL kurang?)"; exit 1 }
          if ($v -notmatch 'libavcodec') { Write-Host "::error::klm-airplay tanpa dekoder suara"; exit 1 }
          $out = "$env:RUNNER_TEMP\ap-out.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--name","KLM CI","--port","8624","--token","abcdef0123456789","--mac","02:11:22:33:44:55","--keyfile","$env:RUNNER_TEMP\ap.key" -RedirectStandardOutput $out -RedirectStandardError "$env:RUNNER_TEMP\ap-err.txt" -PassThru -NoNewWindow
          Start-Sleep -Seconds 4
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $out; Get-Content "$env:RUNNER_TEMP\ap-err.txt" -ErrorAction SilentlyContinue | Select-Object -First 20
          if (-not (Select-String -Path $out -Pattern '"ev":"ready"' -Quiet)) { Write-Host "::error::penerima AirPlay tidak siap"; exit 1 }

      - name: Uji host VST (protokol, parameter, state, throughput)
        run: node native/vsthost/test/host-test.js native/vsthost/build/bin/Release/klm-vsthost.exe native/vsthost/build/KLMTestGain.vst3

      # Uji nyata di Windows: aplikasi dibuka, grafis UTC KLM Acara harus benar-benar tampil di Program
      - name: Smoke test (UTC Acara berlapis, running text native, Scoreboard, audio FX, host VST, simpan preset, SRT)
        shell: pwsh
        run: |
          $env:KLM_SMOKE = "$env:RUNNER_TEMP\smoke"
          $env:KLM_VSTTEST = "$env:GITHUB_WORKSPACE\native\vsthost\build\KLMTestGain.vst3"
          $env:KLM_APTEST = "$env:GITHUB_WORKSPACE\native\airplay\test\uji.h264"
          $env:KLM_APTEST_AUDIO = "$env:GITHUB_WORKSPACE\native\airplay\test\uji.aac"
          # lisensi khusus CI: hanya berlaku di mode pengembangan (electron.exe .) dengan Device ID uji di bawah;
          # diabaikan oleh aplikasi .exe yang dipaketkan → aman ditaruh di sini
          $env:KLM_DEVICE_RAW = "klm-ci-smoke"
          $lic = "$env:APPDATA\KLM Mix\config"; New-Item -ItemType Directory -Force -Path $lic | Out-Null
          Set-Content -Path "$lic\license.json" -Value ('{"key":"' + "KLM1.eyJ2IjoxLCJkIjoiS0xNLVA4MkMtR1I1UC1QNUdYLUZFQzYiLCJuIjoiQ0kgc21va2UgdGVzdCAoaGFueWEgbW9kZSBwZW5nZW1iYW5nYW4pIiwicCI6IkNJIiwiaSI6MTc5NDk5MTIzMzg4MywiZSI6MCwicyI6IktNTVdMVkZPN1YxM0ZBIn0.Z_L1fGXvsoB0LmFVswwKVQvOfOIBGzmLBabgFZnvd9Gw0g9PIbvAr3ZVFQXUKtR3TUDVQFI9CqEixZSEpJK9Qg" + '"}') -Encoding ascii
          $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          Write-Host "PID utama: $($p.Id)"
          $t = 0
          while ($t -lt 200 -and (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 2; $t += 2 }
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Host "::warning::Aplikasi tidak menutup sendiri (timeout)" } else { Write-Host "Aplikasi menutup normal setelah $t detik" }
          Get-Content "$env:KLM_SMOKE\smoke.log" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $left = Get-Process -Name electron -ErrorAction SilentlyContinue
          if ($left) { Write-Host "::warning::Masih ada proses electron tertinggal: $($left.Count)" } else { Write-Host "Tidak ada proses tertinggal" }
          if ((Get-Content "$env:KLM_SMOKE\result.txt" -ErrorAction SilentlyContinue) -ne 'OK') { Write-Host "::warning::Smoke test UTC tidak OK" }

      - name: Upload hasil smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KLM-SmokeTest
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - name: Uji Device ID lisensi (harus dari UUID perangkat keras, stabil)
        shell: pwsh
        run: |
          $env:CIM_UUID = (Get-CimInstance Win32_ComputerSystemProduct).UUID
          $r = node -e "const L=require('./electron/license.js'); const a=L.deviceId(); delete require.cache[require.resolve('./electron/license.js')]; const b=require('./electron/license.js').deviceId(); const c=require('crypto').createHash('sha256').update('klm-device-v2|hw:'+String(process.env.CIM_UUID).toLowerCase()).digest(); const B='0123456789ABCDEFGHJKMNPQRSTVWXYZ'; let bits=0,v=0,o=''; for (const x of c){v=(v<<8)|x;bits+=8;while(bits>=5&&o.length<16){o+=B[(v>>>(bits-5))&31];bits-=5}} const exp='KLM-'+o.match(/.{4}/g).join('-'); console.log(JSON.stringify({id:a, sama:a===b, sumber:L.deviceSource(), cocokUUID:a===exp}))"
          Write-Host "Device ID: $r"
          if ($r -notmatch '"cocokUUID":true') { Write-Host "::warning::Device ID tidak sama dengan UUID perangkat keras (CIM)" }

      - name: Build aplikasi (folder, belum jadi installer)
        run: npx electron-builder --win dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Sumber update di aplikasi (app-update.yml)
        run: node build/release-tools.js app-update dist/win-unpacked/resources

      # ---- tanda tangan kode (opsional) ----
      # A) sertifikat .pfx: secret WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
      - name: Tanda tangan KLM.exe & helper (sertifikat .pfx)
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        run: ./build/sign-windows.ps1 -Files "dist/win-unpacked/KLM.exe","dist/win-unpacked/resources/vsthost/klm-vsthost.exe","dist/win-unpacked/resources/procaudio/klm-procaudio.exe","dist/win-unpacked/resources/airplay/klm-airplay.exe"
      # B) SSL.com eSigner (sertifikat di cloud/HSM) — hanya saat rilis tag v* agar kuota tanda tangan hemat
      - name: Tanda tangan KLM.exe (SSL.com eSigner)
        if: env.ES_USERNAME != '' && env.WIN_CSC_LINK == '' && env.RELEASE == '1'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/win-unpacked/KLM.exe
          override: true
          malware_block: false

      - name: Build installer + portable (dari aplikasi yang sudah ditandatangani)
        run: npx electron-builder --win nsis portable --x64 --publish never --prepackaged dist/win-unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Tanda tangan installer & portable (sertifikat .pfx)
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        run: ./build/sign-windows.ps1 -Files (Get-ChildItem dist/*.exe | ForEach-Object { $_.FullName })
      - name: Daftar installer untuk eSigner
        if: env.ES_USERNAME != '' && env.WIN_CSC_LINK == '' && env.RELEASE == '1'
        id: inst
        shell: pwsh
        run: |
          $s = Get-ChildItem dist/*Setup*.exe | Select-Object -First 1; $p = Get-ChildItem dist/*Portable*.exe | Select-Object -First 1
          "setup=$($s.FullName)" >> $env:GITHUB_OUTPUT; "portable=$($p.FullName)" >> $env:GITHUB_OUTPUT
      - name: Tanda tangan installer (SSL.com eSigner)
        if: steps.inst.outputs.setup != ''
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.inst.outputs.setup }}
          override: true
          malware_block: false
      - name: Tanda tangan portable (SSL.com eSigner)
        if: steps.inst.outputs.portable != ''
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.inst.outputs.portable }}
          override: true
          malware_block: false
      # tanda tangan mengubah isi installer → sha512 di latest.yml (dipakai update di aplikasi) harus diperbarui
      - name: Sesuaikan latest.yml dengan installer akhir
        run: node build/release-tools.js fix-latest

      - name: Status tanda tangan
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/win-unpacked/KLM.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0}: {1} {2}" -f $_.Name, $sig.Status, ($sig.SignerCertificate.Subject -replace '^CN=([^,]+).*','$1'))
          }

      - name: Ukuran aplikasi & isi paket (koffi x64, host VST)
        shell: pwsh
        run: |
          $k = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/koffi/build/koffi"
          if (Test-Path $k) { Get-ChildItem $k | ForEach-Object { Write-Host "koffi: $($_.Name)" } } else { Write-Host "koffi build tidak ditemukan di $k" }
          $sz = (Get-ChildItem dist/win-unpacked -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("win-unpacked: {0:N0} MB" -f $sz)
          Get-ChildItem dist/*.exe | ForEach-Object { Write-Host ("{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB)) }
          if (Test-Path dist/win-unpacked/resources/vsthost/klm-vsthost.exe) { Write-Host "host VST ikut terpasang: resources/vsthost/klm-vsthost.exe" } else { Write-Host "::error::klm-vsthost.exe tidak ada di paket"; exit 1 }
          if (-not (Test-Path dist/win-unpacked/resources/procaudio/klm-procaudio.exe)) { Write-Host "::error::klm-procaudio.exe tidak ada di paket"; exit 1 }
          if (Test-Path dist/win-unpacked/resources/app-update.yml) { Write-Host "app-update.yml:"; Get-Content dist/win-unpacked/resources/app-update.yml } else { Write-Host "::error::app-update.yml tidak ada (update di aplikasi tidak akan jalan)"; exit 1 }
          $eu = node -e "const a=require('@electron/asar'); console.log(a.listPackage('dist/win-unpacked/resources/app.asar').filter(f=>/node_modules[\\/]electron-updater[\\/]package\.json$/.test(f)).length)"
          if ($eu -ne '1') { Write-Host "::error::electron-updater tidak ikut dipaketkan"; exit 1 } else { Write-Host "electron-updater ikut dipaketkan" }
          $yml = @('dist/latest.yml', 'dist/beta.yml') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($yml) { Write-Host "$($yml):"; Get-Content $yml } else { Write-Host "::error::dist/latest.yml / beta.yml tidak dibuat"; exit 1 }
          if (Test-Path dist/win-unpacked/resources/airplay/klm-airplay.exe) { Get-ChildItem dist/win-unpacked/resources/airplay | ForEach-Object { Write-Host ("airplay: {0} {1:N0} KB" -f $_.Name, ($_.Length / 1KB)) } } else { Write-Host "::error::klm-airplay.exe tidak ada di paket"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLM-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

      - name: Catatan rilis (dari README "Baru di vX")
        if: env.RELEASE == '1'
        run: node build/release-tools.js notes ${{ env.VERSION }}

      # latest.yml + installer (+ blockmap) = sumber update di dalam aplikasi
      - name: Publish release (tag v*)
        if: env.RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || 'klmthebest10/klm-releases' }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: KLM v${{ env.VERSION }}
          body_path: dist/release-notes.md
          prerelease: ${{ env.PRERELEASE == '1' }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/beta.yml
            dist/*.blockmap
