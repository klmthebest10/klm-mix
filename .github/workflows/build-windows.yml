name: Build Windows (.exe)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Model segmentasi orang (MediaPipe Selfie Segmenter, Apache-2.0) untuk Latar AI — ikut dipaketkan agar jalan tanpa internet
      - name: Unduh model Latar AI
        shell: pwsh
        run: |
          $u = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"
          Invoke-WebRequest -Uri $u -OutFile web/selfie_segmenter.tflite -MaximumRetryCount 3 -RetryIntervalSec 5
          $f = Get-Item web/selfie_segmenter.tflite
          Write-Host ("model: {0:N0} KB" -f ($f.Length / 1KB))
          if ($f.Length -lt 100000) { Write-Host "::error::model segmentasi tidak terunduh"; exit 1 }
          Get-ChildItem node_modules/@mediapipe/tasks-vision/wasm | ForEach-Object { Write-Host ("{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)) }

      # Host plugin VST asli (klm-vsthost.exe) dibangun dengan VST 3 SDK (lisensi MIT) + plugin uji KLM Test Gain
      - name: Build host VST (VST3 SDK 3.8.1)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          git -C "$env:RUNNER_TEMP\vst3sdk" submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S native/vsthost -B native/vsthost/build -A x64 -DVST3_SDK="$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build native/vsthost/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem native/vsthost/build/bin/Release | ForEach-Object { Write-Host ("{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)) }
          Get-ChildItem -Recurse native/vsthost/build/KLMTestGain.vst3 | ForEach-Object { Write-Host $_.FullName }

      # Penerima AirPlay (klm-airplay.exe, GPL-3.0) dari pustaka UxPlay — iPhone/iPad/Mac mirroring tanpa aplikasi
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist

      - name: Build penerima AirPlay (UxPlay lib, MSYS2 UCRT64)
        shell: msys2 {0}
        run: |
          set -e
          UX="$(cygpath -u "$RUNNER_TEMP")/uxplay"
          git clone https://github.com/FDH2/UxPlay.git "$UX"
          git -C "$UX" checkout 05b0275cb1b726592700e47a6e0307544b3d3a52
          cmake -S native/airplay -B native/airplay/build -G Ninja -DUXPLAY_DIR="$(cygpath -m "$UX")" -DCMAKE_BUILD_TYPE=Release
          cmake --build native/airplay/build
          mkdir -p native/airplay/dist
          cp native/airplay/build/klm-airplay.exe native/airplay/dist/
          strip native/airplay/dist/klm-airplay.exe || true
          ldd native/airplay/dist/klm-airplay.exe | awk '/\/ucrt64\//{print $3}' | sort -u | while read d; do cp "$d" native/airplay/dist/; done
          cp "$UX/LICENSE" native/airplay/dist/COPYING-GPL3.txt
          cp native/airplay/README.md native/airplay/dist/README.txt
          ls -la native/airplay/dist

      - name: Uji penerima AirPlay (berjalan tanpa MSYS2, mengumumkan layanan)
        shell: pwsh
        run: |
          $exe = "native/airplay/dist/klm-airplay.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::klm-airplay.exe tidak bisa dijalankan (DLL kurang?)"; exit 1 }
          $out = "$env:RUNNER_TEMP\ap-out.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--name","KLM Mix CI","--port","8624","--token","abcdef0123456789","--mac","02:11:22:33:44:55","--keyfile","$env:RUNNER_TEMP\ap.key" -RedirectStandardOutput $out -RedirectStandardError "$env:RUNNER_TEMP\ap-err.txt" -PassThru -NoNewWindow
          Start-Sleep -Seconds 4
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $out; Get-Content "$env:RUNNER_TEMP\ap-err.txt" -ErrorAction SilentlyContinue | Select-Object -First 20
          if (-not (Select-String -Path $out -Pattern '"ev":"ready"' -Quiet)) { Write-Host "::error::penerima AirPlay tidak siap"; exit 1 }

      - name: Uji host VST (protokol, parameter, state, throughput)
        run: node native/vsthost/test/host-test.js native/vsthost/build/bin/Release/klm-vsthost.exe native/vsthost/build/KLMTestGain.vst3

      # Uji nyata di Windows: aplikasi dibuka, grafis UTC KLM Acara harus benar-benar tampil di Program
      - name: Smoke test (UTC Acara berlapis, running text native, Scoreboard, audio FX, host VST, simpan preset, SRT)
        shell: pwsh
        run: |
          $env:KLM_SMOKE = "$env:RUNNER_TEMP\smoke"
          $env:KLM_VSTTEST = "$env:GITHUB_WORKSPACE\native\vsthost\build\KLMTestGain.vst3"
          $env:KLM_APTEST = "$env:GITHUB_WORKSPACE\native\airplay\test\uji.h264"
          $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          Write-Host "PID utama: $($p.Id)"
          $t = 0
          while ($t -lt 200 -and (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 2; $t += 2 }
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Host "::warning::Aplikasi tidak menutup sendiri (timeout)" } else { Write-Host "Aplikasi menutup normal setelah $t detik" }
          Get-Content "$env:KLM_SMOKE\smoke.log" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $left = Get-Process -Name electron -ErrorAction SilentlyContinue
          if ($left) { Write-Host "::warning::Masih ada proses electron tertinggal: $($left.Count)" } else { Write-Host "Tidak ada proses tertinggal" }
          if ((Get-Content "$env:KLM_SMOKE\result.txt" -ErrorAction SilentlyContinue) -ne 'OK') { Write-Host "::warning::Smoke test UTC tidak OK" }

      - name: Upload hasil smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KLM-Mix-SmokeTest
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - name: Build installer + portable
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ukuran aplikasi & isi paket (koffi x64, host VST)
        shell: pwsh
        run: |
          $k = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/koffi/build/koffi"
          if (Test-Path $k) { Get-ChildItem $k | ForEach-Object { Write-Host "koffi: $($_.Name)" } } else { Write-Host "koffi build tidak ditemukan di $k" }
          $sz = (Get-ChildItem dist/win-unpacked -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("win-unpacked: {0:N0} MB" -f $sz)
          Get-ChildItem dist/*.exe | ForEach-Object { Write-Host ("{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB)) }
          if (Test-Path dist/win-unpacked/resources/vsthost/klm-vsthost.exe) { Write-Host "host VST ikut terpasang: resources/vsthost/klm-vsthost.exe" } else { Write-Host "::error::klm-vsthost.exe tidak ada di paket"; exit 1 }
          if (Test-Path dist/win-unpacked/resources/airplay/klm-airplay.exe) { Get-ChildItem dist/win-unpacked/resources/airplay | ForEach-Object { Write-Host ("airplay: {0} {1:N0} KB" -f $_.Name, ($_.Length / 1KB)) } } else { Write-Host "::error::klm-airplay.exe tidak ada di paket"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLM-Mix-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
