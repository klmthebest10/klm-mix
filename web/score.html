<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c13">
<title>UTC KLM Scoreboard • KLM HP</title>
<link rel="stylesheet" href="phone.css">
<style>
  html, body { margin: 0; height: 100%; background: #090c13; color: #e6e9f2; font: 14px system-ui, sans-serif; overflow: hidden; }
  /* bilah atas tipis: kembali ke menu KLM tanpa menutupi tombol scoreboard (navigasi bawah scoreboard tetap bebas) */
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 9; height: calc(34px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding-left: 8px; padding-right: 10px; background: #0b0f18; border-bottom: 1px solid #1f2736; }
  #bar button { min-height: 0; min-width: 0; margin: 0; box-sizing: border-box; line-height: 1; width: auto; flex: none; }
  #back { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 13px; border: 1px solid #343c48; background: #141a26; color: #e6e9f2; font: 700 12.5px system-ui, sans-serif; }
  #back svg { width: 15px; height: 15px; }
  #bar b { font-size: 12.5px; color: #8b93a8; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar #rl { margin-left: auto; height: 26px; width: 32px; padding: 0; border-radius: 13px; border: 1px solid #343c48; background: #141a26; color: #e6e9f2; font-size: 14px; }
  iframe { position: fixed; left: 0; right: 0; bottom: 0; top: calc(34px + env(safe-area-inset-top)); width: 100%; height: calc(100% - 34px - env(safe-area-inset-top)); border: 0; background: #090c13; }
  #msg { position: fixed; inset: 0; top: 34px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #8b93a8; line-height: 1.6; }
</style>
</head>
<body>
<div id="bar"><button id="back" title="Kembali ke menu KLM">⬅ Menu</button><b>UTC KLM Scoreboard</b><button id="rl" title="Muat ulang">⟳</button></div>
<div id="msg">Menghubungkan ke KLM di PC…</div>
<iframe id="f" allow="clipboard-write; fullscreen"></iframe>
<script src="icons.js"></script>
<script src="common.js"></script>
<script>
  // Aplikasi HP UTC Score dari PC (/hp di port scoreboard) dibuka DI DALAM aplikasi KLM HP — tidak pindah ke browser
  const s = KMP.server(), f = document.getElementById('f'), msg = document.getElementById('msg');
  let src = '';
  async function load() {
    if (!s.host) { msg.textContent = 'Isi IP PC dulu di menu utama.'; f.style.display = 'none'; return; }
    msg.style.display = ''; msg.textContent = 'Menghubungkan ke KLM di PC…'; f.style.visibility = 'hidden';
    let port = 0;
    try { const j = await (await fetch('http://' + s.host + '/info', { cache: 'no-store' })).json(); port = j && j.ports && j.ports.score; } catch (e) {}
    if (!port) { msg.innerHTML = 'Scoreboard belum aktif di PC.<br>Tambahkan input <b>UTC Score</b> di KLM, lalu ketuk ⟳.<br><br>Bila PC tidak menjawab: pastikan HP & PC di Wi-Fi yang sama, KLM terbuka di PC, dan diizinkan di Firewall Windows.'; return; }
    src = 'http://' + s.host.split(':')[0] + ':' + port + '/hp';
    f.onload = () => { f.style.visibility = 'visible'; msg.style.display = 'none'; };
    f.src = src;
    setTimeout(() => { if (f.style.visibility === 'hidden') msg.innerHTML = 'Scoreboard di PC tidak menjawab (port ' + port + ').<br>Pastikan diizinkan di Firewall Windows, lalu ketuk ⟳.'; }, 7000);
  }
  load();
  document.getElementById('rl').onclick = () => { f.removeAttribute('src'); load(); };
  document.getElementById('back').onclick = () => { location.href = KMP.page('hp'); };
</script>
</body>
</html>
