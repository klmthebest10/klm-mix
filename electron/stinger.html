<!doctype html>
<html><head><meta charset="utf-8"><title>KLM stinger</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden}</style>
</head><body><video id="v" muted playsinline preload="auto"></video>
<script>
'use strict';
// Halaman offscreen transparan untuk video stinger mesin native: tersembunyi saat diam, tampil hanya selama transisi.
const v = document.getElementById('v');
window.klmSet = (u) => new Promise((res) => {
  if (v.src === u && v.readyState >= 2) { res({ ok: true, dur: v.duration }); return; }
  let done = false; const fin = (r) => { if (!done) { done = true; res(r); } };
  v.onloadeddata = () => { v.currentTime = 0; fin({ ok: true, dur: v.duration }); };
  v.onerror = () => fin({ ok: false, err: 'video tidak bisa diputar (kode ' + (v.error ? v.error.code : '?') + ')' });
  setTimeout(() => fin({ ok: v.readyState >= 2, dur: v.duration, err: 'waktu habis memuat video' }), 15000);
  v.src = u; v.load();
});
window.klmPlay = () => { try { v.currentTime = 0; } catch (e) {} v.style.visibility = 'visible'; const p = v.play(); return p && p.then ? p.then(() => 1, () => 0) : 1; };
window.klmStop = () => { v.pause(); v.style.visibility = 'hidden'; try { v.currentTime = 0; } catch (e) {} return 1; };
v.onended = () => { v.style.visibility = 'hidden'; };
</script></body></html>
