<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTC KLM Scoreboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#090C13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UTC KLM">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="fonts-builtin/builtin.css">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: ruang kontrol siaran — konsol skor di kiri, monitor program (preview overlay) menempel di kanan. */
:root{
  --ink:#090C13;        /* dasar ruang kontrol */
  --panel:#10151F;      /* panel konsol */
  --panel2:#161D2B;     /* panel terangkat */
  --line:#242D40;       /* garis pembatas */
  --text:#E9EDF5;
  --mute:#8B95AA;
  --signal:#FFB21E;     /* aksen: lampu tally/amber */
  --live:#FF3B47;       /* ON AIR / merah */
  --ok:#2BD47D;
  --warn:#F5C518;
  --fd:"Saira Condensed","UTC Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --fb:"Archivo","UTC Body","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fm:"JetBrains Mono","UTC Mono",ui-monospace,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font:14px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ===================== PANEL KONTROL ===================== */
.app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-inline:16px}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;max-width:1680px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand-mark{width:38px;height:38px;border-radius:8px;background:var(--signal);color:#1A1200;display:grid;place-items:center;font:900 15px/1 var(--fd);letter-spacing:.02em;transform:skewX(-8deg)}
.brand-mark span{transform:skewX(8deg)}
.brand-name{font:800 24px/1 var(--fd);letter-spacing:.04em}
.brand-name b{color:var(--signal)}
.brand-sub{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.sports{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.sport-btn{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--mute);padding:8px 12px;border-radius:8px;font:700 15px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;transition:background .15s,color .15s}
.sport-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.sport-btn:hover{color:var(--text);background:var(--panel2)}
.sport-btn.on{background:var(--signal);color:#1A1200}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.chip.local .dot{background:var(--signal)}
.chip.bad .dot{background:var(--live)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;line-height:1.1;transition:background .12s,border-color .12s,transform .06s;user-select:none}
.btn:hover{border-color:#3A465F;background:#1C2436}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.pri{background:var(--signal);border-color:var(--signal);color:#1A1200}
.btn.pri:hover{background:#FFC24A}
.btn.red{background:var(--live);border-color:var(--live);color:#fff}
.btn.ghost{background:transparent}
.btn.onair{background:var(--live);border-color:var(--live);color:#fff}
.btn.offair{background:transparent;color:var(--mute)}
.btn[disabled]{opacity:.4;pointer-events:none}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1680px;margin:0 auto;scrollbar-width:none}
.tab{border:0;background:none;color:var(--mute);padding:10px 14px;font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--signal)}

.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:16px;padding:16px;max-width:1680px;width:100%;margin:0 auto;align-items:start}
@media (max-width:1180px){.body{grid-template-columns:minmax(0,1fr)}.aside{order:-1;position:static!important}}
.aside{position:sticky;top:calc(var(--hh,100px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
#main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font:700 17px/1.1 var(--fd);letter-spacing:.08em;text-transform:uppercase}
.card-h .hint{color:var(--mute);font-size:12px}
.card-h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* konsol */
.console{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,320px) minmax(0,1fr);gap:12px}
@media (max-width:860px){.console{grid-template-columns:1fr}.cp{order:-1}}
.tp{--tc:#888;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 32%,transparent),transparent 75%);border-bottom:1px solid var(--line)}
.tp-logo{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#0006;flex:none}
.tp-logo.nologo{display:grid;place-items:center;font:800 20px var(--fd)}
.tp-name{font:700 20px/1.05 var(--fd);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.tp-tag{font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.tp-serve{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.tp-serve.on{background:var(--signal);color:#1A1200;border-color:var(--signal)}
.tp-score{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:10px 10px 4px}
.tp-score .big{font:800 112px/0.9 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tp-score .sets{display:flex;flex-direction:column;align-items:center;padding-bottom:12px}
.tp-score .sets b{font:800 38px/1 var(--fd);color:var(--signal)}
.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.tp-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px 12px}
.tp-btns .btn{padding:14px 6px;font:800 20px/1 var(--fd);letter-spacing:.04em}
.tp-btns .btn.plus{background:color-mix(in srgb,var(--tc) 70%,#000);border-color:color-mix(in srgb,var(--tc) 80%,#fff 0%);color:#fff}
.tp-btns .btn.plus:hover{background:var(--tc)}
.tp-btns .wide{grid-column:span 3}
.tp-btns .full{grid-column:1/-1}
.tp-extra{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ctr-row{display:flex;align-items:center;gap:8px}
.ctr-row .lbl{flex:1;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.ctr-row .val{min-width:44px;text-align:center;font:800 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.ctr-row .val.alert{color:var(--live)}
.ctr-row .btn{width:34px;height:32px;padding:0;font-size:18px;font-weight:700}
.pips{display:flex;gap:4px}
.pip{width:10px;height:10px;border-radius:3px;background:#2A3347}
.pip.on{background:var(--signal)}
.pip.red{background:var(--live)}
.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);min-width:0}
.inp:focus{border-color:var(--signal);outline:none}
select.inp{appearance:auto}

.cp{background:linear-gradient(180deg,#121A29,#0D121C);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cp-period{display:flex;align-items:center;gap:6px}
.cp-period .name{flex:1;text-align:center;font:800 22px/1 var(--fd);letter-spacing:.1em;color:var(--signal);text-transform:uppercase}
.cp-period .btn{width:38px;height:34px;padding:0;font-size:18px}
.cp-time{font:800 74px/1 var(--fd);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em;padding:8px 0 2px;border-radius:10px;background:#05070C;border:1px solid #1C2333}
.cp-time.run{color:#fff;text-shadow:0 0 22px color-mix(in srgb,var(--ok) 35%,transparent)}
.cp-time.stop{color:#C9D0DD}
.cp-sub{display:flex;justify-content:center;gap:8px;font:700 18px var(--fd);color:var(--mute);min-height:20px}
.cp-sub .x{color:var(--signal)}
.go{border:0;border-radius:12px;padding:16px;font:800 26px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:#062012;background:var(--ok);transition:filter .12s}
.go:hover{filter:brightness(1.1)}
.go.pause{background:var(--live);color:#fff}
.adj{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.adj .btn{padding:9px 4px;font-family:var(--fd);font-size:16px;font-weight:700}
.settime{display:flex;gap:6px}
.settime .inp{font-family:var(--fd);font-size:18px;text-align:center}
.shot{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#05070C;border:1px solid #2A1518;border-radius:10px;padding:8px 10px}
.shot .v{font:800 52px/1 var(--fd);color:var(--live);min-width:88px;text-align:center;font-variant-numeric:tabular-nums}
.shot .b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shot .b .btn{padding:10px 4px;font:800 18px var(--fd)}
.added{display:flex;align-items:center;gap:6px}
.added .lbl{flex:1;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.added .val{font:800 26px var(--fd);color:var(--signal);min-width:46px;text-align:center}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field .label{display:flex;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ink);cursor:pointer;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--signal)}
input[type=range]{width:100%;accent-color:var(--signal)}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--ink)}

.pen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.pen-row:last-child{border-bottom:0}
.pen-row .nm{width:120px;font:700 16px var(--fd);text-transform:uppercase;letter-spacing:.04em}
.kicks{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:120px}
.kick{width:22px;height:22px;border-radius:50%;border:2px solid #3A465F}
.kick.g{background:var(--ok);border-color:var(--ok)}
.kick.x{background:var(--live);border-color:var(--live)}
.banner{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--signal) 14%,transparent);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent);font-weight:600}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.tbl td.c{text-align:center;font:700 18px var(--fd)}
.tbl td.win{color:var(--signal)}
.scroll-x{overflow-x:auto}
code,.mono{font-family:var(--fm);font-size:12.5px}
.url{display:flex;gap:8px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;min-width:0}
.url code{flex:1;min-width:0;overflow-wrap:anywhere;color:#CFE3FF}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:#C9D0DD}
.steps b{color:var(--text)}
.kbd{display:inline-block;min-width:22px;text-align:center;padding:2px 6px;border-radius:5px;border:1px solid #3A465F;border-bottom-width:2px;background:var(--panel2);font:600 12px var(--fm)}
.rules-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;color:#CBD2DE;max-width:68ch}
.muted{color:var(--mute)}
.small{font-size:12px}
.log{display:flex;flex-direction:column;max-height:520px;overflow:auto}
.log-i{display:grid;grid-template-columns:70px 64px 1fr;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}
.log-i .t{color:var(--mute);font-family:var(--fm);font-size:12px}
.log-i .c{color:var(--signal);font:700 14px var(--fd)}
.layouts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1400px){.layouts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.layouts{grid-template-columns:repeat(2,minmax(0,1fr))}}

.lay{border:1px solid var(--line);background:var(--ink);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lay.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.lay .sch{aspect-ratio:16/9;max-width:100%;border-radius:6px;background:repeating-conic-gradient(#1A2130 0 25%,#141A27 0 50%) 0 0/16px 16px;position:relative;overflow:hidden}
.lay .sch i{position:absolute;background:linear-gradient(180deg,#FFD27A,var(--signal));border-radius:3px;box-shadow:0 0 10px rgba(255,178,30,.55)}
.lay b{font:700 15px var(--fd);letter-spacing:.06em;text-transform:uppercase}
.lay span{font-size:12px;color:var(--mute)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid #0006;cursor:pointer}


/* turnamen */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.lib-card{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:10px;background:var(--ink);min-width:0}
.lib-card.on{border-color:var(--signal);border-left-color:var(--tc);box-shadow:0 0 0 1px var(--signal)}
.lib-logo{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#0006;flex:none}
.lib-logo.nologo{display:grid;place-items:center;font:800 20px var(--fd);background:#2A3347;color:var(--text)}
.lib-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lib-info b{font:700 18px/1.1 var(--fd);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:break-word}
@media (max-width:760px){.lib-card .lib-act{width:100%;justify-content:flex-start;padding-left:56px}}
.lib-info span{font-size:12px;color:var(--mute)}
.lib-info em{font-style:normal;font-size:11px;font-weight:700;color:var(--signal);letter-spacing:.06em;text-transform:uppercase}
.lib-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:900px){.mform{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:70px minmax(0,1.4fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--ink)}
.mrow.cur{border-color:var(--signal)}
@media (max-width:760px){.mrow{grid-template-columns:56px minmax(0,1fr)}.mrow .mmeta,.mrow .lib-act{grid-column:1/-1}.mrow .lib-act{justify-content:flex-start}}
.mwhen{display:flex;flex-direction:column;font-size:12px;color:var(--mute)}
.mwhen b{font:700 16px var(--fd);color:var(--text)}
.mvs{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.mvs .lib-logo{width:30px;height:30px}
.mvs .mt{font:700 18px var(--fd);text-transform:uppercase;letter-spacing:.03em}
.mvs .mt.win{color:var(--signal)}
.mmeta{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:12px;color:var(--mute);min-width:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mute)}
.pill.live{border-color:var(--live);color:var(--live)}
.pill.done{border-color:var(--ok);color:var(--ok)}
.ed-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.ed-logo{display:flex;flex-direction:column;align-items:center;gap:8px;width:130px}
.ed-logo img,.ed-logo .nologo{width:110px;height:110px;border-radius:14px;object-fit:contain;background:#0006}
.ed-logo .nologo{display:grid;place-items:center;font:800 52px var(--fd)}
.ed-fields{flex:1;min-width:260px;display:flex;flex-direction:column;gap:12px}
.addpl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bulk{margin-top:12px}
.bulk summary{cursor:pointer;color:var(--signal);font-weight:600;font-size:13px}
.nowrap{white-space:nowrap;text-align:right}
.tbl td .inp{padding:6px 8px}
.pick{display:flex;gap:6px;align-items:center}
.pick .inp{padding:6px 8px;font-size:13px}
/* dropdown olahraga (HP) & monitor */
@keyframes pipIn{from{opacity:0;transform:scale(.85);transform-origin:top right}to{opacity:1;transform:none}}
.sport-sel{display:none}
.mon-min{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600}
.monitor.mini .mon-screen{display:none}
@media (max-width:1180px){
 .aside{display:contents}
 .monwrap{order:-1;align-self:start;justify-self:center;width:min(100%,calc(40vh * 16 / 9 + 2px))}
 #quick{order:1}
}
@media (max-width:760px){
 .top{position:static}
 .monwrap{width:calc(100% + 32px);margin-inline:-16px}
 .monwrap>.monitor:not(.floating){border-radius:0 0 14px 14px}
 #sports{display:none}
 .mon-h .label{display:none}
 .mon-h{flex-wrap:nowrap}
 .sport-sel{display:block;flex:1 1 180px;min-width:0;font:700 17px var(--fd);letter-spacing:.06em;text-transform:uppercase;background:var(--signal);color:#1A1200;border-color:var(--signal);padding:9px 12px}
 .top-right{margin-left:0;width:100%}
 .top-right .chip{flex:1;justify-content:center}
}


/* QR HP */
.qr-wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.qr-box{width:220px;max-width:100%;padding:10px;background:#fff;border-radius:14px;box-shadow:0 0 0 3px var(--signal),0 0 30px rgba(255,178,30,.35);flex:none}
.qr-box svg{display:block;width:100%;height:auto}
.qr-side{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.modal-box.qr-modal{max-width:640px}

/* ===== GRAFIS TURNAMEN 1920×1080 (overlay, arena, layar turnamen) ===== */
.gx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);color:#fff;--acc:#FFB21E;animation:gxIn .7s cubic-bezier(.2,1,.3,1) both;perspective:1600px}
.gx.out{animation:gxOut .45s ease-in forwards}
@keyframes gxIn{from{opacity:0;transform:scale(.94) translateY(30px)}to{opacity:1;transform:none}}
@keyframes gxOut{to{opacity:0;transform:scale(.97) translateY(20px)}}
.gx-panel{position:relative;overflow:hidden;width:1640px;flex:none;max-height:960px;border-radius:26px;background:linear-gradient(160deg,rgba(24,31,47,.96),rgba(8,11,18,.97) 70%);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 90px rgba(0,0,0,.6),0 0 calc(80px*var(--glow,.7)) var(--aa,rgba(255,178,30,.4));transform:rotateX(4deg);display:flex;flex-direction:column}
.gx-panel::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,transparent,var(--acc),transparent);box-shadow:0 0 30px var(--acc)}
.gx-head{display:flex;align-items:center;gap:26px;padding:34px 56px 22px}

.qr-opt{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--ink)}
.qr-opt summary{cursor:pointer;font-weight:600;color:var(--signal)}
.qr-opt[open] summary{margin-bottom:10px}
.go.next,.hp-go.next{background:var(--signal);color:#1A1200;font-size:20px}
.go.idle,.hp-go.idle{background:var(--panel2);color:var(--mute);border:1px solid var(--line);font-size:16px}
.phone-tip.warn{border-color:var(--live);background:rgba(255,59,71,.1)}
.phone-tip.warn b{color:#FF8A92}
.pr-lib{color:var(--signal)}
/* ===== popup preview (bisa dipindah) ===== */
.body.no-mon .monwrap{display:contents}
.monitor.floating.enter{animation:pipIn .22s ease-out}
.monitor.floating{position:fixed;z-index:45;left:0;top:0;width:340px;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,178,30,.45),0 0 24px rgba(255,178,30,.18);touch-action:none;user-select:none;-webkit-user-select:none}
.monitor.floating[data-size=s]{--pw:min(48vw,240px)}
.monitor.floating[data-size=m]{--pw:min(72vw,360px)}
.monitor.floating[data-size=l]{--pw:min(94vw,560px)}
.monitor.floating .mon-h{padding:5px 6px;cursor:grab;gap:6px;flex-wrap:nowrap}
.monitor.floating.dragging{cursor:grabbing;opacity:.92;animation:none}
.monitor.floating.dragging .mon-h{cursor:grabbing}
.monitor.floating .mon-h .seg,.monitor.floating .mon-h .label,.monitor.floating #monMin{display:none}
.monitor.floating .mon-h .tally{font-size:10px;padding:2px 6px}
.monitor.floating.mini .mon-screen{display:block}
.monitor.pophide{display:none!important}
.pop-tools{display:none;margin-left:auto;gap:4px;align-items:center}
.pop-grip{display:none;color:var(--mute);font-size:11px;letter-spacing:.1em;margin-left:4px;white-space:nowrap}
.monitor.floating .pop-tools,.monitor.floating .pop-grip{display:flex}
.pop-tools button{width:28px;height:26px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;font-size:14px;line-height:1;padding:0}
.pop-tools button:hover{border-color:var(--signal)}
.pop-tools .x:hover{background:var(--live);border-color:var(--live)}
.pip-hint{display:none!important}
.pop-rs{display:none;position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:3;background:linear-gradient(135deg,transparent 50%,rgba(255,178,30,.9) 50%,rgba(255,178,30,.9) 58%,transparent 58%,transparent 68%,rgba(255,178,30,.9) 68%,rgba(255,178,30,.9) 76%,transparent 76%);border-bottom-right-radius:12px}
.monitor.floating .pop-rs{display:block}
.monitor{position:relative}
.monitor.floating.resizing{animation:none;box-shadow:0 0 0 2px var(--signal),0 16px 40px rgba(0,0,0,.7)}
.pop-fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;gap:6px;border:1px solid var(--signal);background:var(--panel2);color:var(--text);border-radius:999px;padding:10px 14px;font:700 13px var(--fb);box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 16px rgba(255,178,30,.3)}
.pop-fab span{font-size:16px}
.v-hp .pop-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.v-hp .monitor.floating{z-index:25}
.phone-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid var(--signal);background:rgba(255,178,30,.08);font-size:13px}
.phone-tip b{color:var(--signal)}
/* ===== teks berjalan ===== */
.tk .rn{flex:1;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tk-track{display:inline-flex;white-space:nowrap;will-change:transform}
.tk-track.run{animation:tkMove 30s linear infinite}
@keyframes tkMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-seq{display:inline-flex;align-items:center;flex:none}
.tk-i{font-size:30px;font-weight:600;padding:0 26px;color:var(--ofg)}
.tk-sep{font-style:normal;font-size:16px;color:var(--acc);text-shadow:0 0 10px var(--acc)}
/* ===== preset ===== */
.pr-list{display:flex;flex-direction:column;gap:8px}
.pr-card{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--ink)}
.pr-card.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.pr-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.pr-date b{font:800 24px/1 var(--fd);color:var(--signal)}
.pr-date span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pr-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.pr-name{font:700 18px var(--fd);letter-spacing:.03em;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pr-vs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pr-vs .lib-logo{width:24px;height:24px;border-radius:5px;font-size:12px}
.pr-vs b{font:700 15px var(--fd);text-transform:uppercase}
.pr-vs span{font-size:12px;color:var(--mute)}
.pr-meta,.pr-notes{font-size:12px;color:var(--mute)}
.pr-notes{font-style:italic}
.pr-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pr-now{margin-bottom:12px}
.pr-now .pr-card{border-style:dashed}
@media (max-width:640px){.pr-card{grid-template-columns:48px minmax(0,1fr)}.pr-act{grid-column:1/-1;justify-content:flex-start}}
.pe-team{border-left:4px solid var(--tc)}
/* ===== aplikasi HP ===== */
body.v-hp{background:var(--ink);overscroll-behavior:none}
.hp{min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.hp-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(9,12,19,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hp-dot{width:10px;height:10px;border-radius:50%;background:var(--live);flex:none;box-shadow:0 0 0 3px rgba(255,59,71,.25)}
.hp-dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(43,212,125,.25)}
.hp-ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.hp-ttl b{font:800 18px var(--fd);letter-spacing:.06em}
.hp-ttl b em{font-style:normal;color:var(--signal)}
.hp-ttl span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-sport{width:auto;max-width:130px;padding:7px 8px;border-radius:9px;background:var(--signal);color:#1A1200;border:0;font:800 14px var(--fd);letter-spacing:.04em;text-transform:uppercase}
.hp-air{border:0;border-radius:9px;padding:8px 10px;font:800 13px var(--fd);letter-spacing:.1em;background:#2A3347;color:var(--mute)}
.hp-air.on{background:var(--live);color:#fff;box-shadow:0 0 14px rgba(255,59,71,.5)}
.hp-main{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px;max-width:680px;width:100%;margin:0 auto}
.hp-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(13,17,26,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.hp-nav button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 11px var(--fb)}
.hp-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hp-nav button.on{color:var(--signal)}
.hp-clock,.hp-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hp-card h4{margin:0;font:700 15px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.hp-per{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.hp-per b{text-align:center;font:800 20px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.hp-per button,.hp-adj button,.hp-shot button,.hp-row button,.hp-btns button,.hp-step button,.hp-grid3 button,.hp-pen button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;font:700 16px var(--fd);min-height:44px}
.hp-per button{font-size:24px}
.hp-time{font:800 76px/1 var(--fd);text-align:center;padding:8px 0;border-radius:12px;background:#05070C;border:1px solid #1C2333;color:#C9D0DD}
.hp-time.run{color:#fff;text-shadow:0 0 22px rgba(43,212,125,.4)}
.hp-sub{text-align:center;color:var(--mute);font:700 16px var(--fd);min-height:18px}
.hp-sub.big{font-size:18px}.hp-sub b{color:var(--signal)}
.hp-go{border:0;border-radius:14px;min-height:64px;font:800 26px var(--fd);letter-spacing:.1em;background:var(--ok);color:#062012}
.hp-go.pause{background:var(--live);color:#fff}
.hp-adj{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hp-adj:has(button:nth-child(2):last-child){grid-template-columns:1fr 1fr}
.hp-shot{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:6px;align-items:center}
.hp-shot span{font:800 40px var(--fd);color:var(--live);text-align:center}
.hp-sets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font:700 15px var(--fd);color:var(--mute)}
.hp-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp-team{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;background-image:linear-gradient(180deg,var(--ta),transparent 55%)}
.hp-th{display:flex;align-items:center;gap:8px;min-width:0}
.hp-th img,.hp-th .nl{width:30px;height:30px;border-radius:7px;object-fit:contain;flex:none}
.hp-th .nl{display:grid;place-items:center;background:var(--tc);color:var(--ti);font:800 16px var(--fd)}
.hp-th b{flex:1;min-width:0;font:800 20px var(--fd);letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-serve{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:14px}
.hp-serve.on{background:var(--signal);color:#1A1200;border-color:var(--signal);box-shadow:0 0 12px rgba(255,178,30,.6)}
.hp-sc{font:800 84px/0.95 var(--fd);text-align:center;display:flex;flex-direction:column;align-items:center}
.hp-sc small{font:800 15px var(--fd);letter-spacing:.12em;color:var(--signal)}
.hp-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hp-btns button{min-height:54px;font-size:20px}
.hp-btns .plus{background:var(--td);border-color:var(--tc);color:#fff}
.hp-btns .plus.w{grid-column:span 2}
.hp-btns button:last-child:nth-child(4){grid-column:1/-1;min-height:40px;font-size:16px}
.hp-btns button[disabled]{opacity:.4}
.hp-ex{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:8px}
.hp-step{display:grid;grid-template-columns:1fr 38px 44px 38px;align-items:center;gap:4px}
.hp-step span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.hp-step button{min-height:36px;font-size:18px;border-radius:9px}
.hp-step b{text-align:center;font:800 20px var(--fd)}
.hp-step b.hot{color:var(--live)}
.hp-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.hp-row button{font:600 14px var(--fb)}
.hp-pen{display:grid;grid-template-columns:52px 1fr 48px 48px;gap:6px;align-items:center}
.hp-pen .kicks{display:flex;gap:4px;flex-wrap:wrap}
.hp-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hp-grid3 button{font-size:14px}
.hp-grid3 button.on{background:var(--signal);color:#1A1200;border-color:var(--signal)}
.hp-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;min-height:46px;padding:0 14px;font:600 15px var(--fb);text-decoration:none}
.hp-btn.pri{background:var(--signal);border-color:var(--signal);color:#1A1200}
.hp-btn.onair{background:var(--live);border-color:var(--live);color:#fff}
.hp-btn.wide{width:100%}
.hp-inline{display:flex;gap:8px;align-items:center}
.hp-inline .inp{flex:1;min-width:0}
.hp-list{display:flex;flex-direction:column;gap:8px}
.v-hp .card-h{margin-bottom:8px}
.v-hp [data-act=tab]{display:none}
.v-hp .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
.v-hp .quick .btn{min-height:44px;font-size:13px}
.v-hp .inp{font-size:16px}
.v-hp .grid2{grid-template-columns:1fr 1fr;gap:10px}

/* preview monitor */
.monitor{background:#05070C;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mon-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mon-h .tally{font:800 13px var(--fd);letter-spacing:.14em;padding:3px 8px;border-radius:4px;background:var(--live);color:#fff}
.mon-h .tally.off{background:#2A3347;color:var(--mute)}
.mon-h .seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mon-h .seg button{border:0;background:transparent;color:var(--mute);padding:5px 10px;font-size:12px;font-weight:600}
.mon-h .seg button.on{background:var(--panel2);color:var(--text)}
.mon-screen{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:
  radial-gradient(120% 90% at 30% 20%,#2C4A3A 0,#18301F 45%,#0E1D14 100%)}
.mon-screen .pitch{position:absolute;inset:0;opacity:.35;background:
  repeating-linear-gradient(90deg,transparent 0 9%,#ffffff10 9% 18%)}
.mon-screen .stage-host{position:absolute;left:0;top:0;transform-origin:0 0}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.quick .btn{padding:9px 6px;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:70;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal-box h3{margin:0;font:700 20px var(--fd);letter-spacing:.05em;text-transform:uppercase}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;font-size:12.5px}
.shortcuts div{display:flex;gap:8px;align-items:center}
footer.foot{padding:14px 16px 24px;color:var(--mute);font-size:12px;text-align:center}

/* ===================== OVERLAY (1920×1080) ===================== */
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--fd);color:var(--ofg);
  --acc:#FFB21E;--ai:#1A1200;--obg:rgba(9,12,20,.86);--obg2:rgba(20,26,40,.92);--ofg:#fff;--omute:#9AA4B8;--oline:rgba(255,255,255,.08)}
.stage.st-solid{--obg:#0A0E17;--obg2:#151C2A}
.stage.st-light{--obg:rgba(255,255,255,.96);--obg2:#E9EDF4;--ofg:#0B0F18;--omute:#5B657A;--oline:rgba(0,0,0,.08)}
.stage.st-glass .glass{backdrop-filter:blur(14px)}
.stage *{box-sizing:border-box}
.board{position:absolute;filter:drop-shadow(0 10px 28px rgba(0,0,0,.45))}
.board.enter{animation:boardIn .7s cubic-bezier(.2,.9,.2,1)}
.board.leave{animation:boardOut .45s ease-in forwards}
@keyframes boardIn{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes boardOut{to{opacity:0;clip-path:inset(0 0 0 100%)}}
.o-logo{width:44px;height:44px;object-fit:contain;flex:none}
.o-logo.nologo{display:grid;place-items:center;border-radius:6px;font-weight:900;font-size:24px}
.o-serve{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);flex:none}
.o-serve.off{background:transparent;box-shadow:none}
.o-red{display:inline-block;width:13px;height:18px;border-radius:2px;background:#E8202A;transform:rotate(8deg);box-shadow:0 0 0 1px #0004}
.o-pips{display:flex;gap:4px;align-items:center}
.o-pip{width:9px;height:9px;border-radius:2px;background:var(--oline);outline:1px solid var(--oline)}
.o-pip.on{background:var(--acc);outline-color:var(--acc)}
.o-pip.hot{background:#E8202A;outline-color:#E8202A}
.o-chip{font-size:16px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:var(--oline);color:var(--ofg);line-height:1.2;white-space:nowrap}
.o-chip.hot{background:#E8202A;color:#fff}
.o-chip.acc{background:var(--acc);color:var(--ai)}
.o-arrow{font-size:20px;color:var(--acc);font-weight:900}
.o-kicks{display:flex;gap:5px}
.o-kick{width:14px;height:14px;border-radius:50%;border:2px solid var(--omute)}
.o-kick.g{background:#2BD47D;border-color:#2BD47D}
.o-kick.x{background:#E8202A;border-color:#E8202A}
.bumpo{animation:bumpo .7s cubic-bezier(.2,1.4,.3,1)}
@keyframes bumpo{0%{transform:scale(1);filter:brightness(1)}25%{transform:scale(1.35);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}

/* ===================== LAYOUT 3D ===================== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.stage{--glow:.7;--x3:0 1px 0 rgba(0,0,0,.30),0 2px 0 rgba(0,0,0,.26),0 3px 0 rgba(0,0,0,.22),0 4px 0 rgba(0,0,0,.18),0 5px 0 rgba(0,0,0,.14),0 8px 16px rgba(0,0,0,.5)}
.sheen{position:absolute;inset:0;pointer-events:none;z-index:4;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.26) 44%,rgba(255,255,255,.06) 50%,transparent 58%);transform:translateX(-130%);animation:sheen 8s cubic-bezier(.6,0,.3,1) infinite;mix-blend-mode:screen}
@keyframes sheen{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.hit{animation:hit .8s cubic-bezier(.2,1.4,.3,1)}
@keyframes hit{0%{transform:scale(1);filter:brightness(1)}22%{transform:scale(1.26);filter:brightness(1.9) drop-shadow(0 0 16px #fff)}100%{transform:scale(1);filter:brightness(1)}}
.t3{position:relative;display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 26px;font-size:16px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;color:var(--ofg);background:linear-gradient(90deg,transparent,var(--obg) 16%,var(--obg) 84%,transparent)}
.t3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc),0 0 22px var(--acc)}
.t3::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);box-shadow:0 0 calc(16px*var(--glow)) var(--acc)}
.floor{display:block;width:72%;height:26px;margin-top:-2px;background:radial-gradient(50% 60% at 50% 0%,var(--aa),transparent 72%);filter:blur(5px);opacity:var(--glow)}
.sub3{display:flex;align-items:center;justify-content:center;gap:28px;padding:4px 30px;font-size:20px;min-width:520px;background:linear-gradient(90deg,transparent,var(--obg) 14%,var(--obg) 86%,transparent)}
.sub3 .h{display:flex;gap:9px;color:var(--omute);font-weight:600;font-variant-numeric:tabular-nums}
.sub3 .h .w{color:var(--ofg);font-weight:800}
.sub3 .c{color:var(--acc);font-weight:800;letter-spacing:.16em;text-shadow:0 0 12px var(--aa)}
.redpill{color:#fff;background:linear-gradient(180deg,#FF5A63,#C8121D);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 calc(24px*var(--glow)) rgba(255,40,50,.65);font-variant-numeric:tabular-nums}
.accblk{color:var(--ai);background:linear-gradient(180deg,var(--acc-l),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 calc(22px*var(--glow)) var(--aa)}
.teamblk{color:var(--ti);background:linear-gradient(180deg,var(--tl) 0%,var(--tc) 50%,var(--td) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.42),inset 0 -3px 0 rgba(0,0,0,.3);text-shadow:var(--x3);font-variant-numeric:tabular-nums}

/* 1 · PRISMA — kartu kaca miring di pojok kiri atas */
.L-prism{perspective:1700px;perspective-origin:0 40%}
.pz{transform:rotateY(14deg) rotateX(2deg);transform-origin:left center;min-width:540px;display:flex;flex-direction:column;align-items:flex-start}
.pz-top{height:32px;display:flex;align-items:center;padding:0 30px 0 16px;font-size:16px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.pz-body{position:relative;align-self:stretch;overflow:hidden;border-radius:0 18px 18px 6px;background:linear-gradient(165deg,var(--obg2) 0%,var(--obg) 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.45),14px 16px 0 -3px rgba(0,0,0,.38),0 0 calc(50px*var(--glow)) var(--aa)}
.pz-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;z-index:3;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--acc) 70%,transparent);box-shadow:0 0 calc(18px*var(--glow)) var(--acc)}
.pz-row{position:relative;display:flex;align-items:center;height:66px}
.pz-row+.pz-row{border-top:1px solid var(--oline)}
.pz-row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;border-radius:0 4px 4px 0;background:var(--tc);box-shadow:0 0 calc(18px*var(--glow)) var(--tc),0 0 calc(38px*var(--glow)) var(--tc);z-index:2}
.pz-row::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--ta),transparent 55%);opacity:var(--glow)}
.pz-row>*{position:relative;z-index:1}
.pz-row .o-logo{margin-left:22px}
.pz-row .nm{font-size:36px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:0 14px;white-space:nowrap}
.pz-row .meta{margin-left:auto;display:flex;align-items:center;gap:7px;padding-right:12px}
.pz-row .cells{display:flex;align-self:stretch}
.pz-row .cells span{width:42px;display:grid;place-items:center;font-size:26px;font-weight:600;color:var(--omute);border-left:1px solid var(--oline);font-variant-numeric:tabular-nums}
.pz-row .cells .w{color:var(--ofg);font-weight:800}
.pz-row .won{align-self:stretch;width:46px;display:grid;place-items:center;font-size:30px;font-weight:900}
.pz-row .sc{align-self:stretch;width:98px;display:grid;place-items:center;font-size:54px;font-weight:800}
.pz-row .sc.w3{font-size:40px}
.pz-ft{position:relative;display:flex;align-items:stretch;height:48px;background:rgba(0,0,0,.28);border-top:1px solid var(--oline)}
.pz-ft .per{display:grid;place-items:center;padding:0 18px;font-size:24px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.pz-ft .clk{display:grid;place-items:center;padding:0 18px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:124px}
.pz-ft .add{display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--acc);text-shadow:0 0 12px var(--aa)}
.pz-ft .shc{margin-left:auto;min-width:82px;display:grid;place-items:center;font-size:32px;font-weight:800}
.pz-ft .stat{margin-left:auto;display:grid;place-items:center;padding:0 16px;font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--acc);text-shadow:0 0 14px var(--aa);white-space:nowrap}

/* 2 · SAYAP — dua panel tim melipat ke belakang, inti jam menonjol ke depan */
.L-wings{perspective:1300px;display:flex;flex-direction:column;align-items:center;gap:6px}
.wg{display:flex;align-items:center;transform-style:preserve-3d}
.wg-w{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;height:82px;min-width:390px;background:linear-gradient(180deg,var(--obg2),var(--obg));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.wg-w.l{transform-origin:right center;transform:rotateY(24deg);justify-content:flex-end;padding-left:46px;clip-path:polygon(34px 0,100% 0,100% 100%,0 100%)}
.wg-w.r{transform-origin:left center;transform:rotateY(-24deg);flex-direction:row-reverse;justify-content:flex-end;padding-right:46px;clip-path:polygon(0 0,calc(100% - 34px) 0,100% 100%,0 100%)}
.wg-w::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;z-index:3;background:var(--tc);box-shadow:0 0 calc(22px*var(--glow)) var(--tc),0 0 calc(40px*var(--glow)) var(--tc)}
.wg-w::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--glow)}
.wg-w.l::after{background:linear-gradient(270deg,var(--ta),transparent 62%)}
.wg-w.r::after{background:linear-gradient(90deg,var(--ta),transparent 62%)}
.wg-w>*{position:relative;z-index:1}
.wg .nm{font-size:36px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.wg .meta{display:flex;align-items:center;gap:7px}
.wg .sc{align-self:stretch;width:102px;display:grid;place-items:center;font-size:58px;font-weight:800}
.wg .sc.w3{font-size:42px}
.wg .won{align-self:stretch;width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:900;line-height:1}
.wg .won small{font-size:11px;letter-spacing:.12em;margin-top:3px}
.wg-core{position:relative;z-index:5;transform:translateZ(54px);min-width:206px;height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 20px;border-radius:0 0 24px 24px;background:radial-gradient(120% 120% at 50% 0%,var(--aa) 0%,var(--obg2) 46%,var(--obg) 100%);border-top:3px solid var(--acc);box-shadow:0 0 calc(56px*var(--glow)) var(--aa),inset 0 1px 0 rgba(255,255,255,.28),0 18px 30px rgba(0,0,0,.45)}
.wg-core .clk{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wg-core .cs{display:flex;align-items:center;gap:8px}
.wg-core .per{font-size:16px;font-weight:800;letter-spacing:.18em;color:var(--acc);text-shadow:0 0 12px var(--aa);white-space:nowrap}
.wg-core .add{color:var(--acc);font-size:20px;font-weight:800}
.wg-core .shc{font-size:20px;font-weight:800;padding:0 8px;border-radius:5px;min-width:40px;text-align:center}

/* 3 · NEON — kapsul melayang dengan cincin cahaya berputar */
.L-neon{perspective:1000px;display:flex;flex-direction:column;align-items:center;gap:8px}
.nn{position:relative;padding:3px;border-radius:999px;transform:rotateX(12deg);transform-origin:top center;background:conic-gradient(from var(--ang),var(--c0),var(--acc),var(--c1),#ffffff,var(--c0));animation:nspin 6s linear infinite;box-shadow:0 0 calc(36px*var(--glow)) var(--aa),0 16px 30px rgba(0,0,0,.45)}
@keyframes nspin{to{--ang:360deg}}
.nn-in{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;height:82px;padding:0 9px;border-radius:999px;background:linear-gradient(180deg,var(--obg2),var(--obg) 62%);box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -12px 22px rgba(0,0,0,.45)}
.nn-t{display:flex;align-items:center;gap:12px;min-width:250px}
.nn-t.l{justify-content:flex-end;padding-left:28px}
.nn-t.r{flex-direction:row-reverse;justify-content:flex-end;padding-right:28px}
.nn-t .nm{font-size:36px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 calc(20px*var(--glow)) var(--tc)}
.nn-t .meta{display:flex;align-items:center;gap:6px}
.orb{width:68px;height:68px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--ti);font-variant-numeric:tabular-nums;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0,var(--tl) 16%,var(--tc) 48%,var(--td) 100%);box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 calc(28px*var(--glow)) var(--tc),inset 0 -6px 12px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.32)}
.orb.w3{font-size:28px}
.nn .won{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--ai);background:radial-gradient(circle at 35% 30%,#fff 0,var(--acc-l) 26%,var(--acc) 72%);box-shadow:0 0 calc(16px*var(--glow)) var(--aa)}
.nn-c{display:flex;flex-direction:column;align-items:center;min-width:150px}
.nn-c .clk{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.nn-c .per{font-size:15px;font-weight:800;letter-spacing:.18em;color:var(--acc);text-shadow:0 0 12px var(--aa);white-space:nowrap}
.nn-c .add{color:var(--acc)}
.nn-c .shc{color:#FF4D57;text-shadow:0 0 10px rgba(255,40,50,.85);margin-left:6px}
.nn .sheen{border-radius:999px}

/* 4 · KUBUS — bar lantai di bawah layar, skor di kubus 3D yang berputar */
.L-cube{perspective:1100px;perspective-origin:50% -30%;display:flex;flex-direction:column;align-items:center;gap:6px}
.cb{display:flex;align-items:center;transform-style:preserve-3d;transform:rotateX(14deg);transform-origin:bottom center}
.cb-plate{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;height:80px;min-width:440px;padding:0 28px;background:linear-gradient(180deg,var(--obg2),var(--obg));box-shadow:inset 0 2px 0 rgba(255,255,255,.16)}
.cb-plate.l{justify-content:flex-end;padding-left:52px;clip-path:polygon(30px 0,100% 0,100% 100%,0 100%)}
.cb-plate.r{flex-direction:row-reverse;justify-content:flex-end;padding-right:52px;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 100%,0 100%)}
.cb-plate::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:var(--tc);box-shadow:0 0 calc(22px*var(--glow)) var(--tc),0 0 calc(40px*var(--glow)) var(--tc)}
.cb-plate::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--glow)}
.cb-plate.l::after{background:linear-gradient(270deg,var(--ta),transparent 60%)}
.cb-plate.r::after{background:linear-gradient(90deg,var(--ta),transparent 60%)}
.cb-plate>*{position:relative;z-index:1}
.cb .nm{font-size:40px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.cb .meta{display:flex;align-items:center;gap:7px}
.cb .won{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:56px;border-radius:8px;font-size:30px;font-weight:900;line-height:1}
.cb .won small{font-size:10px;letter-spacing:.12em;margin-top:3px}
.cube{width:100px;height:100px;position:relative;flex:none;margin:0 16px;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(var(--ry))}
.cube.l{--ry:-24deg}
.cube.r{--ry:24deg}
.cube .f{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden}
.cube .fr{transform:translateZ(50px);font-size:62px;font-weight:800}
.cube .fr.w3{font-size:44px}
.cube .tp{transform:rotateX(90deg) translateZ(50px);background:linear-gradient(180deg,#fff,var(--tl));opacity:.92}
.cube .sd{background:linear-gradient(90deg,var(--td),var(--tc))}
.cube.l .sd{transform:rotateY(90deg) translateZ(50px)}
.cube.r .sd{transform:rotateY(-90deg) translateZ(50px)}
.cube .sh{transform:rotateX(-90deg) translateZ(50px);background:rgba(0,0,0,.5)}
.cube.hit{animation:cspin .9s cubic-bezier(.3,1.25,.4,1)}
@keyframes cspin{from{transform:rotateX(-16deg) rotateY(var(--ry)) rotateX(-360deg)}to{transform:rotateX(-16deg) rotateY(var(--ry)) rotateX(0deg)}}
.cb-mid{position:relative;z-index:5;transform:translateZ(36px);min-width:200px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 18px;border-radius:18px;background:radial-gradient(120% 120% at 50% 100%,var(--aa) 0%,var(--obg2) 46%,var(--obg) 100%);border-bottom:3px solid var(--acc);box-shadow:0 0 calc(50px*var(--glow)) var(--aa),inset 0 1px 0 rgba(255,255,255,.26)}
.cb-mid .clk{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cb-mid .cs{display:flex;align-items:center;gap:8px}
.cb-mid .per{font-size:16px;font-weight:800;letter-spacing:.18em;color:var(--acc);text-shadow:0 0 12px var(--aa);white-space:nowrap}
.cb-mid .add{color:var(--acc);font-size:20px;font-weight:800}
.cb-mid .shc{font-size:20px;font-weight:800;padding:0 8px;border-radius:5px;min-width:40px;text-align:center}

/* 5 · MENARA — kartu bertumpuk di sisi kanan, miring ke dalam */
.L-tower{perspective:1500px;perspective-origin:100% 30%}
.tw{display:flex;flex-direction:column;align-items:stretch;gap:10px;transform:rotateY(-16deg);transform-origin:right center;width:400px}
.tw .t3{justify-content:flex-end;padding-right:6px;background:linear-gradient(90deg,transparent,var(--obg) 30%)}
.tw .t3::after{left:30%;right:0}
.tw-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;height:100px;padding-left:20px;border-radius:6px 20px 20px 6px;background:linear-gradient(115deg,var(--ta) 0%,var(--obg2) 38%,var(--obg) 100%);border-left:5px solid var(--tc);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),-14px 16px 0 -3px rgba(0,0,0,.38),0 0 calc(36px*var(--glow)) var(--ta)}
.tw-card.b{margin-right:26px}
.tw-card .o-logo{width:52px;height:52px}
.tw-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.tw-info .nm{font-size:36px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-info .meta{display:flex;align-items:center;gap:7px;min-height:20px;flex-wrap:wrap}
.tw-info .cells{display:flex;gap:9px;font-size:18px;color:var(--omute);font-variant-numeric:tabular-nums}
.tw-info .cells .w{color:var(--ofg);font-weight:800}
.tw-card .sc{align-self:stretch;width:112px;display:grid;place-items:center;font-size:72px;font-weight:800}
.tw-card .sc.w3{font-size:52px}
.tw-clk{position:relative;overflow:hidden;margin-right:52px;display:flex;align-items:stretch;height:60px;border-radius:6px 16px 16px 6px;background:linear-gradient(180deg,var(--obg2),var(--obg));border-bottom:2px solid var(--acc);box-shadow:0 0 calc(34px*var(--glow)) var(--aa),inset 0 1px 0 rgba(255,255,255,.2)}
.tw-clk .per{display:grid;place-items:center;padding:0 16px;font-size:24px;font-weight:800;white-space:nowrap}
.tw-clk .clk{flex:1;display:grid;place-items:center;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.tw-clk .add{display:grid;place-items:center;padding-right:10px;font-size:22px;font-weight:800;color:var(--acc)}
.tw-clk .shc{min-width:74px;display:grid;place-items:center;font-size:32px;font-weight:800}
.tw-clk .stat{flex:1;display:grid;place-items:center;padding:0 14px;font-size:18px;font-weight:800;letter-spacing:.12em;color:var(--acc);text-shadow:0 0 12px var(--aa);white-space:nowrap}

/* — popup 3D — */
.pop{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);display:flex;align-items:stretch;height:132px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));animation:popIn .8s cubic-bezier(.2,1.1,.3,1) both;transform-origin:50% 100%}
.pop::before{content:"";position:absolute;left:-80px;right:-80px;top:-70px;bottom:-70px;z-index:-1;background:radial-gradient(closest-side,var(--pa),transparent);animation:burst 1.3s ease-out both}
.pop.top{bottom:auto;top:90px;transform-origin:50% 0}
.pop.out{animation:popOut .5s ease-in forwards}
.pop .tg{position:relative;overflow:hidden;white-space:nowrap;background:linear-gradient(135deg,var(--pl) 0%,var(--pc) 45%,var(--pd) 100%);color:var(--pi);display:flex;align-items:center;gap:20px;padding:0 46px 0 34px;font-size:92px;font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%);text-shadow:var(--x3);box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.pop .tg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);animation:shine 1.4s .4s ease-out}
.pop .tg .o-logo{width:84px;height:84px}
.pop .tg .o-logo.nologo{font-size:44px;font-style:normal;text-shadow:none}
.pop .inf{position:relative;background:linear-gradient(180deg,var(--obg2),var(--obg));display:flex;flex-direction:column;justify-content:center;padding:0 40px 0 38px;margin-left:-14px;min-width:340px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.pop .inf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pc);box-shadow:0 0 18px var(--pc)}
.pop .inf .a{font-size:40px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pop .inf .b{font-size:26px;color:var(--omute);font-weight:600;white-space:nowrap}
@keyframes popIn{0%{opacity:0;transform:translateX(-50%) perspective(1200px) rotateX(-80deg) translateY(30px)}55%{opacity:1}100%{opacity:1;transform:translateX(-50%) perspective(1200px) rotateX(0deg)}}
@keyframes popOut{to{opacity:0;transform:translateX(-50%) perspective(1200px) rotateX(75deg)}}
@keyframes burst{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:.5;transform:scale(1)}}
@keyframes shine{to{transform:translateX(120%)}}

/* — lower third & ticker — */
.lt{position:absolute;left:96px;bottom:140px;display:flex;flex-direction:column;align-items:flex-start;transform:perspective(1000px) rotateY(14deg);transform-origin:left center;animation:ltIn .7s cubic-bezier(.2,1,.3,1) both;filter:drop-shadow(0 14px 28px rgba(0,0,0,.45))}
.lt .a{position:relative;overflow:hidden;color:var(--ai);background:linear-gradient(135deg,var(--acc-l),var(--acc));font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:6px 30px 4px 24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.lt .b{position:relative;background:linear-gradient(180deg,var(--obg2),var(--obg));color:var(--ofg);font-size:28px;font-weight:600;padding:6px 30px 8px 24px}
.lt .b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent);box-shadow:0 0 14px var(--acc)}
@keyframes ltIn{from{opacity:0;transform:perspective(1000px) rotateY(70deg) translateX(-40px)}to{opacity:1;transform:perspective(1000px) rotateY(14deg)}}
.tk{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,var(--obg2),var(--obg));display:flex;align-items:stretch;animation:tkIn .5s ease-out both;box-shadow:0 -2px 0 var(--acc),0 -8px calc(26px*var(--glow)) var(--aa)}
.tk .lb{color:var(--ai);background:linear-gradient(180deg,var(--acc-l),var(--acc));display:grid;place-items:center;padding:0 26px;font-size:26px;font-weight:900;letter-spacing:.12em;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);padding-right:36px}
@keyframes tkRun{to{transform:translateX(-100%)}}
@keyframes tkIn{from{transform:translateY(100%)}to{transform:none}}

/* ===================== ARENA (layar LED / proyektor) ===================== */
.arena{position:relative;isolation:isolate;width:100%;height:100%;background:radial-gradient(120% 80% at 50% 0%,#141C2D 0%,#06080D 70%);color:#fff;font-family:var(--fd);display:flex;flex-direction:column;overflow:hidden;--acc:#FFB21E;--ai:#1A1200}
.arena .ah{display:flex;justify-content:space-between;align-items:center;padding:1.4vw 2.4vw;font-size:1.9vw;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9AA4B8;gap:2vw}
.arena .ah b{color:var(--acc);text-shadow:0 0 1.2vw var(--aa,rgba(255,178,30,.5))}
.arena::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:calc(.4 + .6*var(--glow,.7));background:radial-gradient(38% 55% at 20% 58%,var(--c0a,transparent),transparent 72%),radial-gradient(38% 55% at 80% 58%,var(--c1a,transparent),transparent 72%)}
.arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.35vw;background:linear-gradient(90deg,transparent,var(--acc),transparent);box-shadow:0 0 2vw var(--acc);opacity:var(--glow,.7)}
.arena .ah{position:relative}

 const sp=S.sport,R=S.rules[sp];
 Object.assign(S,{score:[0,0],period:1,added:0,fouls:[0,0],to:[0,0],toWin:'',cards:[{y:0,r:0},{y:0,r:0}],subs:[0,0],sets:[],won:[0,0],serve:0,firstServe:0,poss:0,over:false,flip:false,

function penResult(S){const R=S.rules[S.sport],N=R.shootoutKicks||5,k=S.pen.k;

function addScore(i,n){
 if(S.over&&isRally(S.sport))return;
 const sp=S.sport;
 if(isRally(sp)){addPoint(i,n);return}
 commit(s=>{s.score[i]=Math.max(0,s.score[i]+n);
  if(n>0&&s.ov.autoPopup){if(sp==='football'||sp==='futsal')popup('goal',i,'GOL!',s.players[i]?(s.players[i]+' · '+clockText(s,now())):teamName(i));

function addPoint(i,n){

 const sp=S.sport,R=S.rules[sp];let msg=null;
 commit(s=>{
  s.score[i]++;s.serve=i;
  const a=s.score[i],b=s.score[1-i];
  if(winsSet(s,a,b)){
   const unit=sp==='volleyball'?'SET':'GAME';
   s.sets.push([s.score[0],s.score[1],i]);s.won[i]++;
   if(s.won[i]>=needSets(s)){s.over=true;s.clock.ms=clockVal(s,now());s.clock.running=false;popup('win',i,'MENANG',teamName(i)+' · '+s.won[0]+'–'+s.won[1]);msg='Pertandingan selesai, '+teamName(i)+' menang '+s.won[0]+'–'+s.won[1]}
   else{popup('set',i,unit+' '+s.period,teamName(i)+' · '+s.sets[s.sets.length-1][0]+'–'+s.sets[s.sets.length-1][1]);
    msg=unit+' '+s.period+' untuk '+teamName(i)+'. Tim pindah tempat.';
    s.period++;s.score=[0,0];s.to=[0,0];s.subs=[0,0];s.toWin=toWindow(s);
    if(sp==='badminton')s.serve=i;else{s.firstServe=1-s.firstServe;s.serve=s.firstServe}}
  }else{
   if(sp==='badminton'&&a===R.interval&&b<R.interval){msg=s.period===R.bestOf?'Interval 60 detik — pindah tempat (game penentuan)':'Interval 60 detik'}
   if(sp==='volleyball'&&s.period===R.bestOf&&a===R.switchAt&&b<R.switchAt)msg='Set penentuan: tim pindah lapangan';
  }
 },'Poin '+teamName(i)+' ('+(S.score[0]+(i===0?1:0))+'–'+(S.score[1]+(i===1?1:0))+')');

function nextPeriod(){

 if(isRally(sp)){

  ask('Tutup '+periodLong(S)+' secara manual?','Skor '+S.score[0]+'–'+S.score[1]+' dicatat sebagai kemenangan '+teamName(w)+'.','Tutup set').then(ok=>{if(!ok)return;

  s.clock={running:false,ms:clockDir(s)==='down'?periodLen(s):0,at:0};

let lastFlat=0;
function tick(){
 if(S){const t=now();
  const ct=clockText(S,t),sh=shotText(S,t),ex=extraText(S,t);
  for(const el of document.querySelectorAll('[data-clock]'))if(el.textContent!==ct)el.textContent=ct;
  for(const el of document.querySelectorAll('[data-shot]'))if(el.textContent!==sh)el.textContent=sh;
  for(const el of document.querySelectorAll('[data-extra]'))if(el.textContent!==ex)el.textContent=ex;
  if(VIEW==='control'||VIEW==='hp'){
   if(S.clock.running&&clockDir(S)==='down'&&clockVal(S,t)<=0){commit(s=>{s.clock={running:false,ms:0,at:0};if(s.sport==='basketball'){s.shot.ms=shotVal(s,t);s.shot.running=false}},'Waktu '+periodLong(S)+' habis');buzz(1.4);toast('Waktu '+periodLong(S)+' habis')}
   else if(S.sport==='basketball'&&S.shot.running&&shotVal(S,t)<=0){commit(s=>{s.shot={running:false,ms:0,at:0};s.clock.ms=clockVal(s,t);s.clock.running=false},'Pelanggaran shot clock');buzz(0.9);toast('Shot clock habis — jam dihentikan')}
   if(MODE==='server'&&(S.clock.running||S.shot.running)&&t-lastFlat>250){lastFlat=t;pushFlat()}
   const cp=$('.cp-time');if(cp){cp.classList.toggle('run',S.clock.running);cp.classList.toggle('stop',!S.clock.running)}
  }
 }
 requestAnimationFrame(tick);
}

/* ========================================================= STRUKTUR TURNAMEN / CUP ========================================================= */
let TSUB='tim',JF='all',JCOURT='',EDM=null,BD_I=0;
const CUP0={format:'groups',groupCount:2,qualify:2,third:true,pw:3,pd:1,pl:0,courts:['Lapangan 1','Lapangan 2'],date:'',time:'08:00',dur:30,teams:[],groups:[],sport:''};
const FORMATS={league:['Liga','Semua tim saling bertemu sekali. Juara = poin tertinggi.'],groups:['Grup + Gugur','Fase grup, tim teratas lolos ke babak gugur sampai final.'],knockout:['Gugur (Cup)','Langsung sistem gugur. Kalah sekali langsung tersingkir.']};
function cupNorm(c){c=Object.assign(clone(CUP0),c||{});if(!Array.isArray(c.courts)||!c.courts.length)c.courts=['Lapangan 1'];if(!Array.isArray(c.teams))c.teams=[];if(!Array.isArray(c.groups))c.groups=[];return c}
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const hm=d=>pad2(d.getHours())+':'+pad2(d.getMinutes());
const byTime=(x,y)=>((x.date||'9')+(x.time||'99')+String(+String(x.code||'M999').slice(1)).padStart(4,'0')).localeCompare((y.date||'9')+(y.time||'99')+String(+String(y.code||'M999').slice(1)).padStart(4,'0'));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roundRobin(ids){const t=ids.slice();if(t.length<2)return [];if(t.length%2)t.push(null);const n=t.length,rounds=[];
 for(let r=0;r<n-1;r++){const ps=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)ps.push((r+i)%2?[b,a]:[a,b])}rounds.push(ps);t.splice(1,0,t.pop())}return rounds}
function seedOrder(n){let a=[1];while(a.length<n){const m=a.length*2+1;a=a.flatMap(x=>[x,m-x])}return a}
function stageName(k){return {2:'Final',4:'Semifinal',8:'Perempat Final',16:'16 Besar',32:'32 Besar',64:'64 Besar'}[k]||(k+' Besar')}
const groupNames=n=>Array.from({length:n},(_,i)=>String.fromCharCode(65+i));
function cupTeams(){return LIB.cup.teams.filter(id=>teamById(id))}
function syncGroups(){const C=LIB.cup;if(C.format!=='groups')return;const names=groupNames(Math.max(1,Math.min(8,C.groupCount|0||2)));
 const old=C.groups;C.groups=names.map(n=>({name:n,teams:((old.find(g=>g.name===n)||{}).teams||[]).filter(id=>C.teams.includes(id))}));
 const placed=new Set(C.groups.flatMap(g=>g.teams));C.teams.forEach(id=>{if(!placed.has(id)){const g=C.groups.slice().sort((a,b)=>a.teams.length-b.teams.length)[0];g.teams.push(id)}})}
function autoGroups(mode){const C=LIB.cup,ids=cupTeams();
 if(mode==='data'){const tg=ids.map(id=>(teamById(id).group||'').trim().toUpperCase());if(tg.every(Boolean)){const names=[...new Set(tg)].sort();C.groupCount=names.length;C.groups=names.map(n=>({name:n,teams:ids.filter((id,k)=>tg[k]===n)}));return true}}
 const order=mode==='random'?shuffle(ids):ids;const names=groupNames(C.groupCount);C.groups=names.map(n=>({name:n,teams:[]}));
 order.forEach((id,k)=>{const row=Math.floor(k/names.length),col=k%names.length;C.groups[row%2?names.length-1-col:col].teams.push(id)});return mode!=='data'}

/* --- pembuatan bagan & jadwal --- */
function buildCup(){const C=LIB.cup,F=C.format,sp=C.sport||S.sport,nC=C.courts.length;
 const keep=LIB.matches.filter(m=>!m.gen),out=[];let n=0,slot=0,rowTeams=new Set();
 const newRow=()=>{if(slot%nC){slot=Math.ceil(slot/nC)*nC}rowTeams=new Set()};
 const place=(m,ids)=>{if(ids&&ids.some(x=>rowTeams.has(x)))newRow();m._row=Math.floor(slot/nC);m.court=C.courts[slot%nC];slot++;if(slot%nC===0)rowTeams=new Set();(ids||[]).forEach(x=>rowTeams.add(x))};
 const push=o=>{n++;const m=Object.assign({id:uid(),code:'M'+n,gen:true,sport:sp,status:'scheduled',result:'',winner:'',hs:null,as:null,pen:null,date:'',time:'',court:'',home:null,away:null},o);out.push(m);return m};
 let groups=[];
 if(F==='league')groups=[{name:'',teams:cupTeams()}];
 if(F==='groups'){syncGroups();groups=C.groups.map(g=>({name:g.name,teams:g.teams.filter(id=>teamById(id))}))}
 if(groups.length){const rr=groups.map(g=>roundRobin(g.teams)),maxR=Math.max(0,...rr.map(r=>r.length));
  for(let r=0;r<maxR;r++){groups.forEach((g,gi)=>{(rr[gi][r]||[]).forEach(([h,a])=>{const m=push({stage:'group',group:g.name,round:r+1,home:h,away:a,label:F==='league'?'Pekan '+(r+1):'Grup '+g.name+' · Matchday '+(r+1)});place(m,[h,a])})})}}
 let entrants=[];
 if(F==='groups'){for(let k=1;k<=C.qualify;k++)groups.forEach(g=>{if(g.teams.length>=k)entrants.push(g.name+k)})}
 if(F==='knockout')entrants=cupTeams();
 if(entrants.length>=2){const size=2**Math.ceil(Math.log2(entrants.length));let cur=seedOrder(size).map(s=>entrants[s-1]||null),lastSF=[];
  if(F==='groups'){const grp=r=>r?r.replace(/\d+$/,''):null,bad=k=>cur[k]&&cur[k+1]&&grp(cur[k])===grp(cur[k+1]);for(let k=0;k<cur.length;k+=2){if(!bad(k))continue;for(let j=0;j<cur.length;j+=2){if(j===k||!cur[j+1])continue;[cur[k+1],cur[j+1]]=[cur[j+1],cur[k+1]];if(!bad(k)&&!bad(j))break;[cur[k+1],cur[j+1]]=[cur[j+1],cur[k+1]]}}}
  while(cur.length>1){
   if(cur.length===2&&C.third&&lastSF.length===2){newRow();const m=push({stage:'3P',label:'Perebutan Juara 3',homeRef:'L:'+lastSF[0],awayRef:'L:'+lastSF[1]});place(m)}
   newRow();const nm=stageName(cur.length),nxt=[],codes=[];
   for(let i=0;i<cur.length;i+=2){const a=cur[i],b=cur[i+1];if(a&&b){const m=push({stage:nm,label:nm,homeRef:a,awayRef:b});place(m);codes.push(m.code);nxt.push('W:'+m.code)}else nxt.push(a||b)}
   if(cur.length===4)lastSF=codes;cur=nxt}}
 timeRows(out);out.forEach(m=>delete m._row);
 LIB.matches=keep.concat(out);C.built=Date.now();saveLib();return out.length}
function timeRows(list){const C=LIB.cup;const base=new Date((C.date||ymd(new Date()))+'T'+(C.time||'08:00'));
 list.forEach(m=>{const t=new Date(base.getTime()+m._row*(C.dur||30)*60000);m.date=ymd(t);m.time=hm(t)})}
function retime(){const C=LIB.cup,nC=C.courts.length;const gen=LIB.matches.filter(m=>m.gen).sort((a,b)=>(+a.code.slice(1))-(+b.code.slice(1)));
 let slot=0,prevStage=null,rowTeams=new Set();const newRow=()=>{if(slot%nC)slot=Math.ceil(slot/nC)*nC;rowTeams=new Set()};
 gen.forEach(m=>{if(m.stage!=='group'&&m.stage!==prevStage)newRow();prevStage=m.stage;const ids=m.stage==='group'?[m.home,m.away]:[];
  if(ids.some(x=>rowTeams.has(x)))newRow();m._row=Math.floor(slot/nC);m.court=C.courts[slot%nC];slot++;if(slot%nC===0)rowTeams=new Set();ids.forEach(x=>rowTeams.add(x))});
 timeRows(gen);gen.forEach(m=>delete m._row);saveLib()}

/* --- hasil, klasemen, pemenang --- */
function winnerSide(m){if(!m||m.status!=='done'||m.hs==null||m.as==null)return null;if(m.hs>m.as)return 0;if(m.as>m.hs)return 1;if(m.pen&&m.pen[0]!=null&&m.pen[1]!=null&&m.pen[0]!==m.pen[1])return m.pen[0]>m.pen[1]?0:1;return null}
function groupMatches(g){return LIB.matches.filter(m=>m.gen&&m.stage==='group'&&m.group===g)}
function groupDone(g){const ms=groupMatches(g);return ms.length>0&&ms.every(m=>m.status==='done')}
function standings(g){const C=LIB.cup;const ids=g===''&&C.format==='league'?cupTeams():((C.groups.find(x=>x.name===g)||{}).teams||[]);
 const T={};ids.forEach(id=>{if(teamById(id))T[id]={id,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0,form:[]}});
 groupMatches(g).filter(m=>m.status==='done'&&m.hs!=null).sort(byTime).forEach(m=>{const a=T[m.home],b=T[m.away];if(!a||!b)return;a.P++;b.P++;a.GF+=+m.hs;a.GA+=+m.as;b.GF+=+m.as;b.GA+=+m.hs;
  if(m.hs>m.as){a.W++;b.L++;a.form.push('W');b.form.push('L')}else if(m.hs<m.as){b.W++;a.L++;b.form.push('W');a.form.push('L')}else{a.D++;b.D++;a.form.push('D');b.form.push('D')}});
 const h2h=(x,y)=>{const m=groupMatches(g).find(z=>z.status==='done'&&((z.home===x&&z.away===y)||(z.home===y&&z.away===x)));if(!m||m.hs===m.as)return 0;const xw=(m.home===x)===(m.hs>m.as);return xw?-1:1};
 return Object.values(T).map(r=>(r.GD=r.GF-r.GA,r.Pts=r.W*C.pw+r.D*C.pd+r.L*C.pl,r)).sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF||h2h(x.id,y.id)||teamById(x.id).name.localeCompare(teamById(y.id).name))}
function resolveRef(ref,d){d=d||0;if(!ref||d>16)return null;if(teamById(ref))return ref;let m=ref.match(/^([WL]):(.+)$/);
 if(m){const x=LIB.matches.find(z=>z.gen&&z.code===m[2]);const w=winnerSide(x);if(w==null)return null;const ids=matchIds(x,d+1);return m[1]==='W'?ids[w]:ids[1-w]}
 m=ref.match(/^(.*?)(\d+)$/);if(m&&LIB.cup.groups.some(g=>g.name===m[1])){if(!groupDone(m[1]))return null;const st=standings(m[1]);return st[+m[2]-1]?st[+m[2]-1].id:null}return null}
function matchIds(x,d){return [x.home||resolveRef(x.homeRef,d),x.away||resolveRef(x.awayRef,d)]}
function refLabel(ref){if(!ref)return 'Belum ditentukan';let m=ref.match(/^([WL]):(.+)$/);if(m)return (m[1]==='W'?'Pemenang ':'Kalah ')+m[2];m=ref.match(/^(.*?)(\d+)$/);if(m)return ({1:'Juara',2:'Runner-up'}[m[2]]||'Peringkat '+m[2])+' Grup '+m[1];return 'Belum ditentukan'}
function resultStr(m){if(m.hs==null)return '';return m.hs+'–'+m.as+(m.pen&&m.pen[0]!=null?' (pen '+m.pen[0]+'–'+m.pen[1]+')':'')}
function cupChampion(){const fin=LIB.matches.find(m=>m.gen&&m.stage==='Final');
 if(fin){const w=winnerSide(fin);if(w==null)return null;const ids=matchIds(fin),tp=LIB.matches.find(m=>m.gen&&m.stage==='3P');let third=null;if(tp){const w3=winnerSide(tp);if(w3!=null)third=matchIds(tp)[w3]}return {champ:ids[w],runner:ids[1-w],third}}
 if(LIB.cup.format==='league'){const ms=LIB.matches.filter(m=>m.gen);if(ms.length&&ms.every(m=>m.status==='done')){const st=standings('');return {champ:st[0]&&st[0].id,runner:st[1]&&st[1].id,third:st[2]&&st[2].id}}}return null}
function koRounds(){const ko=LIB.matches.filter(m=>m.gen&&m.stage!=='group').sort((a,b)=>(+a.code.slice(1))-(+b.code.slice(1)));const order=[],map={};
 ko.forEach(m=>{if(m.stage==='3P')return;if(!map[m.stage]){map[m.stage]=[];order.push(m.stage)}map[m.stage].push(m)});return {rounds:order.map(s=>({name:s,matches:map[s]})),third:ko.find(m=>m.stage==='3P')}}
function cupGroupsList(){const C=LIB.cup;if(C.format==='league')return LIB.matches.some(m=>m.gen&&m.stage==='group')?['']:[];if(C.format==='groups')return C.groups.map(g=>g.name);return []}
function hasCup(){return LIB.matches.some(m=>m.gen)}

/* --- snapshot grafis (dipakai overlay, arena, layar turnamen) --- */
function logoUrl(t){if(!t||!t.logo)return '';return MODE==='server'?'/lib/logo/'+encodeURIComponent(t.id)+'.png?v='+t.logo.length:t.logo}
function tmSnap(id){const t=teamById(id);return t?{n:t.name,s:t.short||shortFrom(t.name),c:t.color||'#888',l:logoUrl(t)}:null}
function matchSnap(m){const ids=m.gen?matchIds(m):[m.home,m.away];const sd=i=>tmSnap(ids[i])||{n:refLabel(i?m.awayRef:m.homeRef),s:'?',c:'#3A465F',l:'',tbd:1};
 return {code:m.code||'',date:m.date||'',time:m.time||'',court:m.court||'',label:m.label||'',h:sd(0),a:sd(1),st:m.status==='done'?'done':(S.matchRef===m.id?'live':''),hs:m.hs,as:m.as,pen:m.pen,win:winnerSide(m)}}
function gfxSnap(kind,opt){opt=opt||{};const C=LIB.cup,title=LIB.name||S.match.title||'Turnamen';let sub='',data={};
 const all=LIB.matches.slice().sort(byTime);
 if(kind==='schedule'){let list,mode=opt.mode||'next';
  if(mode==='next'){list=all.filter(m=>m.status!=='done');sub='Jadwal Pertandingan'}
  else if(mode==='results'){list=all.filter(m=>m.status==='done').slice(-8);sub='Hasil Pertandingan'}
  else{const d=opt.date||ymd(new Date());list=all.filter(m=>m.date===d);sub='Jadwal '+(d?new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'}):'')}
  if(!list.length)return null;data={rows:list.slice(0,8).map(matchSnap),more:Math.max(0,list.length-8)}}
 else if(kind==='standings'){const gs=opt.group!=null?[opt.group]:cupGroupsList();if(!gs.length)return null;
  sub=gs.length===1?(gs[0]?'Klasemen Grup '+gs[0]:'Klasemen'):'Klasemen Sementara';
  data={q:C.format==='groups'?C.qualify:0,groups:gs.map(g=>({name:g,rows:standings(g).map((r,k)=>Object.assign({pos:k+1,t:tmSnap(r.id)},{P:r.P,W:r.W,D:r.D,L:r.L,GF:r.GF,GA:r.GA,GD:r.GD,Pts:r.Pts,form:r.form.slice(-5)}))}))}}
 else if(kind==='bracket'){const k=koRounds();if(!k.rounds.length)return null;sub='Bagan '+(C.format==='knockout'?'Pertandingan':'Babak Gugur');
  const ch=cupChampion();data={rounds:k.rounds.map(r=>({name:r.name,matches:r.matches.map(matchSnap)})),third:k.third?matchSnap(k.third):null,champ:ch&&ch.champ?tmSnap(ch.champ):null}}
 else if(kind==='champion'){const ch=cupChampion();if(!ch||!ch.champ)return null;sub='Juara';data={champ:tmSnap(ch.champ),runner:tmSnap(ch.runner),third:tmSnap(ch.third)}}
 else if(kind==='next'){const m=opt.id?LIB.matches.find(x=>x.id===opt.id):all.find(x=>x.status!=='done');if(!m)return null;sub='Pertandingan Berikutnya';data={m:matchSnap(m)}}
 return {id:Date.now(),kind,title,sub,brand:S.ov.brand||'UTC KLM',data}}
function showGfx(kind,opt){const g=gfxSnap(kind,opt);if(!g){toast(kind==='champion'?'Juara belum ditentukan':'Belum ada data untuk ditampilkan');return}commit(s=>{s.gfx=g},null);toast('Tampil di layar: '+g.sub)}
function hideGfx(){commit(s=>{s.gfx=null},null)}
function refreshGfx(){if(S.gfx&&S.gfx.kind){const g=gfxSnap(S.gfx.kind,S.gfx.opt||{});if(g){g.id=S.gfx.id;g.opt=S.gfx.opt;S.gfx=g;send()}}}

 else if(g.kind==='champion'){body='<div class="gx-podium"><div class="gx-ch-main">'+TROPHY+gxLogo(d.champ,'huge')+'<div class="gx-ch-lbl">JUARA</div><div class="gx-ch-nm">'+esc(d.champ.n)+'</div></div><div class="gx-ch-rest">'+(d.runner?'<div><span>Runner-up</span>'+gxTeam(d.runner)+'</div>':'')+(d.third?'<div><span>Juara 3</span>'+gxTeam(d.third)+'</div>':'')+'</div></div>'}
 else if(g.kind==='next'){const m=d.m;body='<div class="gx-next"><div class="gx-nt" style="--tc:'+esc(m.h.c)+'">'+gxLogo(m.h,'huge')+'<b>'+esc(m.h.n)+'</b></div><div class="gx-nmid"><span class="gx-vs big">VS</span><div class="gx-ninfo"><b>'+esc(m.time||'')+'</b><span>'+esc([fmtD(m.date),m.court].filter(Boolean).join(' · '))+'</span><em>'+esc(m.label)+'</em></div></div><div class="gx-nt" style="--tc:'+esc(m.a.c)+'">'+gxLogo(m.a,'huge')+'<b>'+esc(m.a.n)+'</b></div></div>'}

 let detail='';
 if(F==='groups'){syncGroups();detail='<div class="row" style="margin:14px 0 10px"><div class="pick"><label class="label" for="cup-gc">Jumlah grup</label><select class="inp" id="cup-gc" data-cup="groupCount" data-num="1">'+[1,2,3,4,5,6,7,8].map(n=>'<option'+(C.groupCount==n?' selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="pick"><label class="label" for="cup-q">Lolos per grup</label><select class="inp" id="cup-q" data-cup="qualify" data-num="1">'+[1,2,3,4].map(n=>'<option'+(C.qualify==n?' selected':'')+'>'+n+'</option>').join('')+'</select></div><button class="btn sm" data-act="grpAuto" data-v="data">Pakai grup dari data tim</button><button class="btn sm" data-act="grpAuto" data-v="snake">Bagi rata</button><button class="btn sm" data-act="grpAuto" data-v="random">🎲 Undi acak</button></div>'+

 if(F==='knockout'){const ids=cupTeams();detail='<div class="row" style="margin:14px 0 10px"><span class="label">Urutan unggulan (atas = unggulan 1)</span><button class="btn sm" data-act="seedShuffle">🎲 Undi acak</button></div><div class="seeds">'+ids.map((id,k)=>{const t=teamById(id);return '<div class="seed"><span class="sn">'+(k+1)+'</span>'+teamChip(t)+'<b>'+esc(t.name)+'</b><button class="btn sm ghost" data-act="seedUp" data-i="'+k+'" aria-label="Naikkan">↑</button><button class="btn sm ghost" data-act="seedDn" data-i="'+k+'" aria-label="Turunkan">↓</button></div>'}).join('')+'</div>'+(ids.length&&(ids.length&(ids.length-1))?'<p class="muted small">'+ids.length+' tim: '+(2**Math.ceil(Math.log2(ids.length))-ids.length)+' unggulan teratas otomatis lolos ke babak berikutnya (bye).</p>':'')}
 const num=(k,l,min,max)=>'<div class="field"><label class="label" for="cup-'+k+'">'+l+'</label><input class="inp" type="number" min="'+min+'" max="'+max+'" id="cup-'+k+'" data-cup="'+k+'" data-num="1" value="'+esc(C[k])+'"></div>';
