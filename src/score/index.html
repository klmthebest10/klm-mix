function estimateCup(){const C=LIB.cup,ids=cupTeams();let g=0,k=0;
 if(C.format==='league'){g=ids.length*(ids.length-1)/2}
 if(C.format==='groups'){syncGroups();C.groups.forEach(x=>{g+=x.teams.length*(x.teams.length-1)/2});const e=C.groups.reduce((n,x)=>n+Math.min(C.qualify,x.teams.length),0);if(e>=2){k=e-1+(C.third&&e>=4?1:0)}}
 if(C.format==='knockout'){if(ids.length>=2)k=ids.length-1+(C.third&&ids.length>=4?1:0)}
 const tot=g+k,ok=ids.length>=2&&tot>0;const rows=Math.ceil(g/C.courts.length)+(k?Math.ceil(k/C.courts.length)+2:0);
 return {ok,text:ok?tot+' pertandingan'+(g&&k?' ('+g+' fase grup, '+k+' babak gugur)':''):'Pilih minimal dua tim',sub:ok?'Perkiraan durasi ±'+Math.ceil(rows*(C.dur||30)/60)+' jam di '+C.courts.length+' lapangan':''}}

/* QR code mini (byte mode, koreksi L, versi 1–10) — tanpa internet */
const QR=(()=>{
 const EC=[null,[7,1,19,0,0],[10,1,34,0,0],[15,1,55,0,0],[20,1,80,0,0],[26,1,108,0,0],[18,2,68,0,0],[20,2,78,0,0],[24,2,97,0,0],[30,2,116,0,0],[18,2,68,2,69]];
 const AL=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
 const EXP=new Array(512),LOG=new Array(256);let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
 const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
 function rsGen(n){let g=[1];for(let i=0;i<n;i++){const r=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){r[j]^=g[j];r[j+1]^=mul(g[j],EXP[i])}g=r}return g}
 function rsRem(data,n){const g=rsGen(n),r=data.concat(new Array(n).fill(0));for(let i=0;i<data.length;i++){const c=r[i];if(c)for(let j=0;j<g.length;j++)r[i+j]^=mul(g[j],c)}return r.slice(data.length)}

  const bytes=Array.from(new TextEncoder().encode(text));let v=1;
  for(;v<=10;v++){const e=EC[v],cap=e[1]*e[2]+e[3]*e[4],cc=v<10?8:16;if(4+cc+bytes.length*8<=cap*8)break}
  if(v>10)throw new Error('Teks terlalu panjang untuk QR');
  const e=EC[v],cap=e[1]*e[2]+e[3]*e[4],cc=v<10?8:16;const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>i)&1)};
  put(4,4);put(bytes.length,cc);bytes.forEach(b=>put(b,8));put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
  const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));for(let p=0;data.length<cap;p++)data.push(p%2?0x11:0xEC);

  const cw=[];const maxD=Math.max(...blocks.map(b=>b.d.length));for(let i=0;i<maxD;i++)blocks.forEach(b=>{if(i<b.d.length)cw.push(b.d[i])});for(let i=0;i<e[0];i++)blocks.forEach(b=>cw.push(b.ec[i]));
  const N=v*4+17,M=Array.from({length:N},()=>new Array(N).fill(null)),F=Array.from({length:N},()=>new Array(N).fill(false));
  const set=(r,c,val)=>{M[r][c]=val;F[r][c]=true};
  const finder=(r,c)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const rr=r+i,cc2=c+j;if(rr<0||cc2<0||rr>=N||cc2>=N)continue;const on=i>=0&&i<=6&&j>=0&&j<=6&&(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));set(rr,cc2,on)}};
  finder(0,0);finder(0,N-7);finder(N-7,0);

   for(let c=0;c<N;c++){let run=1;for(let r=1;r<N;r++){if(G[r][c]===G[r-1][c]){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}

const POP_MIN=150;

 const was=m.classList.contains('floating');
 if(want&&!was){if(w&&TAB==='match')w.style.minHeight=w.offsetHeight+'px';m.classList.add('floating','enter');setTimeout(()=>m.classList.remove('enter'),260)}
 else if(!want&&was){m.classList.remove('floating');if(w)w.style.minHeight='';m.style.left='';m.style.top='';m.style.width=''}
 if(w&&TAB!=='match')w.style.minHeight='';
 const hide=want&&!!POP.hide;m.classList.toggle('pophide',hide);const pb=$('#popBtn');if(pb)pb.hidden=!hide;popFab(hide);

function popResizeBy(dw){const m=$('#monitor'),old=popWidth();POP.w=Math.max(POP_MIN,Math.min(innerWidth-8,old+dw));const x=parseFloat(m.style.left);if(!isNaN(x))POP.x=Math.min(x-(POP.w-old)*(x+old/2>innerWidth/2?1:0),innerWidth-POP.w-4);popSave();popPlace();fitPreview()}
function popInit(){const m=$('#monitor');let d=null;
 m.addEventListener('pointerdown',e=>{if(!m.classList.contains('floating')||e.target.closest('button')||e.button>0)return;const r=m.getBoundingClientRect();
  const rs=!!e.target.closest('.pop-rs');d={rs,dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,w0:r.width,x0:r.left,moved:false};if(rs){e.preventDefault();m.classList.add('resizing')}try{m.setPointerCapture(e.pointerId)}catch(_){}});
 m.addEventListener('pointermove',e=>{if(!d)return;if(!d.moved&&Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy)>(d.rs?1:6)){d.moved=true;if(!d.rs)m.classList.add('dragging')}if(!d.moved)return;
  if(d.rs){const dxw=e.clientX-d.sx,dyw=(e.clientY-d.sy)*16/9;const nw=Math.max(POP_MIN,Math.min(innerWidth-8,d.w0+(Math.abs(dyw)>Math.abs(dxw)?dyw:dxw)));POP.w=Math.round(nw);POP.x=Math.min(d.x0,innerWidth-nw-4);popPlace();fitPreview()}
  else{POP.x=e.clientX-d.dx;POP.y=e.clientY-d.dy;popPlace()}});
 const end=e=>{if(!d)return;const mv=d.moved,rs=d.rs;d=null;m.classList.remove('dragging','resizing');if(mv){POP.x=parseFloat(m.style.left)||0;POP.y=parseFloat(m.style.top)||0;popSave();fitPreview()}else if(!rs&&e.type==='pointerup'&&VIEW!=='hp'&&TAB==='match'&&!e.target.closest('button'))window.scrollTo({top:0,behavior:'smooth'})};

  const w=seqs[0].offsetWidth;if(!w)return;tr.style.animationDuration=(w/Math.max(20,speed||110)).toFixed(2)+'s';tr.classList.add('run')};

   p.updated=Date.now();const k=presets().findIndex(x=>x.id===p.id);if(k>=0)presets()[k]=p;else presets().push(p);savePresets();PEDIT=null;render();toast('Preset "'+p.name+'" disimpan')},

function paintBoard(){const st=$('#bdStage'),w=$('#bdGx');if(!st||!S)return;if(!LIB.cup)LIB=libNorm(LIB);const A=S.ov.accent||'#FFB21E';st.style.setProperty('--acc',A);st.style.setProperty('--acc-l',shade(A,.35));st.style.setProperty('--aa',rgba(A,.5));st.style.setProperty('--ai',ink(A));st.style.setProperty('--glow',String((S.ov.glow==null?70:S.ov.glow)/100));
 if(S.gfx){paintGfx(w,S);return}
 const ks=boardKinds();if(!ks.length){w._key='';w.innerHTML='<div class="bd-empty">'+esc(LIB.name||S.match.title||'UTC KLM')+'<br>Jadwal belum tersedia</div>';return}
 if(Date.now()-BD_LAST>14000||!w._key){BD_LAST=Date.now();BD_I=(BD_I+1)%ks.length}
 const [kind,opt]=ks[BD_I%ks.length];const g=gfxSnap(kind,opt);if(g){const prev=w._g;g.id=prev&&prev.kind===kind&&JSON.stringify(prev.opt)===JSON.stringify(opt)?prev.id:Date.now();g.opt=opt;w._g=g;paintGfx(w,{gfx:g})}}

/* ========================================================= BOOT ========================================================= */
async function boot(){
 try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}}catch(e){}
 const saved=lsGet('utc-klm-state');
 S=normalize(saved?(()=>{try{return JSON.parse(saved)}catch(e){return defaultState()}})():defaultState());
 if(VIEW==='overlay'){document.body.className='v-overlay';$('#root').innerHTML='<div class="stage" id="ovStage"></div>';fitOverlay();addEventListener('resize',fitOverlay)}
 else if(VIEW==='turnamen'){document.body.className='v-board';$('#root').innerHTML='<div id="bdRoot"><div id="bdStage" class="stage"><div class="bd-clock" id="bdClock"></div><div class="gxwrap" id="bdGx"></div></div></div>';const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);$('#bdStage').style.transform='translate(-50%,-50%) scale('+s+')'};fit();addEventListener('resize',fit);$('#bdRoot').addEventListener('dblclick',()=>{try{document.documentElement.requestFullscreen()}catch(e){}})}
 else if(VIEW==='arena'){document.body.className='v-arena';$('#root').innerHTML='<div id="arenaRoot"></div>';$('#arenaRoot').addEventListener('dblclick',()=>{try{document.documentElement.requestFullscreen()}catch(e){}})}
 else if(VIEW==='hp'){hpShell();bindEvents()}
 else{shell();bindEvents()}
 const srv=await detectServer();
 if(srv){MODE='server';
  try{const r=await fetch('/api/state',{cache:'no-store'});const j=await r.json();if(j&&j.state)S=normalize(j.state);else if(VIEW==='control')send()}catch(e){}
  connectSSE();
 }else{
  try{bc=new BroadcastChannel('utc-klm');bc.onmessage=ev=>{const m=ev.data;if(!m||m.from===ID||!m.state)return;S=normalize(m.state);onState()}}catch(e){}
  addEventListener('storage',ev=>{if(ev.key==='utc-klm-state'&&ev.newValue&&!bc){try{S=normalize(JSON.parse(ev.newValue));onState()}catch(e){}}});
 }
 if(VIEW==='control'||VIEW==='turnamen'||VIEW==='hp')await loadLib();
 if(VIEW==='control'||VIEW==='hp')await loadPresets();
 if(VIEW==='turnamen'){setInterval(()=>{const c=$('#bdClock');if(c)c.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});paintBoard()},1000)}
 onState();if(VIEW==='control'){paintStatus();fitPreview()}
 requestAnimationFrame(tick);
 if((VIEW==='control'||VIEW==='hp')&&MODE==='server')setInterval(pushFlat,2000);
}
boot();
</script>
