<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>UTC KLM Acara — Overlay</title>
<link rel="stylesheet" href="" id="gf">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
body.pv{background:#0b0d12 repeating-conic-gradient(#151922 0 25%,#0f1218 0 50%) 0 0/40px 40px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;-webkit-font-smoothing:antialiased}
.anim{position:absolute;transition:bottom .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1)}
.aw{position:relative;display:inline-block;isolation:isolate;vertical-align:top}
.abar{display:none;position:absolute;top:-15%;height:130%;left:0;width:100%;opacity:0;pointer-events:none;z-index:5;will-change:transform,opacity}
.abar::before{content:'';position:absolute;top:0;bottom:0;left:-4px;width:8px;background:#fff;border-radius:8px;box-shadow:0 0 18px 6px var(--a),0 0 70px 24px rgba(var(--a-rgb),.65)}
.anim.in .aw,.anim.out .aw,.anim.in .abar,.anim.out .abar{animation-duration:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.anim.out .aw,.anim.out .abar{animation-direction:reverse}

/* ===== keyframes animasi masuk/keluar ===== */
@keyframes k_lightWipe{0%{clip-path:inset(-30% 100% -30% 0)}100%{clip-path:inset(-30% 0 -30% 0)}}
@keyframes kb_lightWipe{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translate3d(100%,0,0);opacity:0}}
@keyframes k_unfold{0%{transform:scale(0,.05);filter:brightness(5);opacity:0}15%{opacity:1}55%{transform:scale(1,.05);filter:brightness(4)}100%{transform:scale(1,1);filter:brightness(1);opacity:1}}
@keyframes k_flip3d{0%{transform:perspective(900px) rotateX(-100deg);opacity:0;filter:brightness(3)}55%{opacity:1}100%{transform:perspective(900px) rotateX(0);filter:brightness(1);opacity:1}}
@keyframes k_swing3d{0%{transform:perspective(1200px) rotateY(85deg);opacity:0;filter:brightness(2.5)}50%{opacity:1}100%{transform:perspective(1200px) rotateY(0);filter:brightness(1);opacity:1}}
@keyframes k_cubeTurn{0%{transform:perspective(1000px) rotateX(-90deg);opacity:0;filter:brightness(.4)}100%{transform:perspective(1000px) rotateX(0);filter:brightness(1);opacity:1}}
@keyframes k_zoomGlow{0%{transform:scale(1.5);filter:blur(16px) brightness(3);opacity:0}100%{transform:scale(1);filter:blur(0) brightness(1);opacity:1}}
@keyframes k_slideLight{0%{transform:translateX(-160px) skewX(-12deg);filter:blur(8px) brightness(2.4);opacity:0}100%{transform:none;filter:none;opacity:1}}
@keyframes k_riseFlash{0%{transform:translateY(90px);opacity:0;filter:brightness(3)}55%{opacity:1}100%{transform:none;filter:brightness(1);opacity:1}}
@keyframes k_dropBounce{0%{transform:perspective(900px) translateY(-170px) rotateX(60deg);opacity:0}60%{transform:perspective(900px) translateY(14px) rotateX(-8deg);opacity:1}80%{transform:perspective(900px) translateY(-5px) rotateX(3deg)}100%{transform:perspective(900px) translateY(0) rotateX(0);opacity:1}}
@keyframes k_lightBurst{0%{opacity:0;transform:scale(.92);filter:brightness(7) saturate(0)}40%{opacity:1;filter:brightness(4) saturate(.4)}100%{opacity:1;transform:scale(1);filter:brightness(1) saturate(1)}}
@keyframes k_fade{0%{opacity:0}100%{opacity:1}}

/* ===== efek cahaya ===== */
.fx{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;z-index:3;
  overflow:hidden;border-radius:0}
/* kilau menyapu: pita digerakkan GPU (transform) di dalam bingkai persegi — tanpa masker sudut yang berat */
.fx::before{content:'';position:absolute;top:0;bottom:0;left:0;width:28%;will-change:transform;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.08) 30%,rgba(255,255,255,.6) 50%,rgba(255,255,255,.08) 70%,transparent);
  -webkit-mask:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
  animation:kSweep 3.6s ease-in-out infinite}
/* bentuk kapsul / pil: kilau mengikuti lengkungan (gradien di latar elemen itu sendiri) */
.L-capsule>.fx,.L-orbit .txt>.fx,.T-capsule>.fx,.G-glass .fx,.G-beacon .fx,.S-glass .fx,.S-pill .fx{overflow:visible;border-radius:inherit;
  background:linear-gradient(100deg,transparent 45.33%,rgba(255,255,255,.08) 48.13%,rgba(255,255,255,.6) 50%,rgba(255,255,255,.08) 51.87%,transparent 54.67%) no-repeat;
  background-size:300% 100%;background-position:88% 0;animation:kSwBg 3.6s ease-in-out infinite}
.L-capsule>.fx::before,.L-orbit .txt>.fx::before,.T-capsule>.fx::before,.G-glass .fx::before,.G-beacon .fx::before,.S-glass .fx::before,.S-pill .fx::before{display:none}
@keyframes kSwBg{0%{background-position:88% 0}55%,100%{background-position:8% 0}}
@keyframes kSweep{0%{transform:translate3d(-143%,0,0)}55%,100%{transform:translate3d(429%,0,0)}}
@keyframes kSweepB{0%{transform:translate3d(-115%,0,0)}55%,100%{transform:translate3d(343%,0,0)}}
.edge{position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:inherit;padding:3px;pointer-events:none;z-index:4;
  background:conic-gradient(from var(--ang),transparent 0deg,transparent 240deg,rgba(var(--a-rgb),.6) 290deg,#fff 325deg,var(--a) 340deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:kAng 3s linear infinite;will-change:transform;contain:strict}
@keyframes kAng{to{--ang:360deg}}
.edge2{position:absolute;top:-3px;left:-3px;width:calc(100% + 6px);height:calc(100% + 6px);overflow:visible;pointer-events:none;z-index:4;will-change:transform}
.edge2 rect{fill:none;stroke-dasharray:24 76;stroke-linecap:round;animation:kEdge 3s linear infinite}
.edge2 .eg{stroke:rgba(var(--a-rgb),.45);stroke-width:9}
.edge2 .ec{stroke:#fff;stroke-width:3;filter:none}
@keyframes kEdge{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.flare{position:absolute;top:-34px;left:-50%;width:100%;height:70px;pointer-events:none;z-index:5;will-change:transform,opacity;background:radial-gradient(110px 35px at 50% 50%,#fff 0,rgba(255,255,255,.9) 6%,rgba(var(--a-rgb),.7) 18%,transparent 62%);animation:kFlare 4.5s ease-in-out infinite}
.flare::after{content:'';position:absolute;left:calc(50% - 330px);width:660px;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(var(--a-rgb),.9),#fff,rgba(var(--a-rgb),.9),transparent)}
@keyframes kFlare{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate3d(100%,0,0);opacity:0}}
.beam{position:absolute;left:-18%;right:-18%;top:-110%;bottom:-30%;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 100%,rgba(var(--a-rgb),.32) 0deg 3deg,transparent 3deg 12deg);
  -webkit-mask:radial-gradient(ellipse 60% 75% at 50% 100%,#000 15%,transparent 72%);mask:radial-gradient(ellipse 60% 75% at 50% 100%,#000 15%,transparent 72%);animation:kBeam 4s ease-in-out infinite}
@keyframes kBeam{0%,100%{opacity:.45}50%{opacity:1}}
.sp{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:none;z-index:6;animation:kTw 2.2s ease-in-out infinite}
.sp::before,.sp::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(transparent,#fff,transparent);box-shadow:0 0 8px var(--a),0 0 2px #fff}
.sp::after{transform:rotate(90deg)}
@keyframes kTw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes kGlowF{0%,100%{filter:drop-shadow(0 0 3px rgba(var(--a-rgb),.35))}50%{filter:drop-shadow(0 0 24px rgba(var(--a-rgb),.95))}}
.glw{position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;border-radius:18px;pointer-events:none;will-change:opacity;
  box-shadow:0 0 26px 6px rgba(var(--a-rgb),.85),0 0 70px 16px rgba(var(--a-rgb),.38);opacity:.18;animation:kGlowO 2.4s ease-in-out infinite}
@keyframes kGlowO{0%,100%{opacity:.18}50%{opacity:1}}
.bug .bglow{position:absolute;top:0;left:0;width:100%;height:auto;pointer-events:none;will-change:opacity;filter:drop-shadow(0 0 10px var(--a)) drop-shadow(0 0 22px rgba(var(--a-rgb),.8));opacity:.15;animation:kGlowO 2.4s ease-in-out infinite}
.bug>img:not(.bglow){position:relative}
.lx-shimmer .card:not(.L-ribbon) .nm,.lx-shimmer .tt-main{background:linear-gradient(100deg,var(--t) 0%,var(--t) 40%,#fff 47%,var(--a) 50%,#fff 53%,var(--t) 60%,var(--t) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none!important;animation:kShim 3.2s linear infinite}

.lx-shimmer .card.L-float .nm{background-image:linear-gradient(100deg,var(--t) 0%,var(--t) 40%,var(--p) 47%,var(--a) 50%,var(--p) 53%,var(--t) 60%,var(--t) 100%)}

.lx-shimmer .card .nm,.lx-shimmer .tt-main,.lx-shimmer .gp,.lx-shimmer .sitem .sh,.ocl-shimmer .oc-ti,.ocl-combo .oc-ti{will-change:transform}
.L-orbit .lgb::before,.S-badge .si::before{will-change:transform}
@keyframes kShim{0%{background-position:150% 0}100%{background-position:-100% 0}}

/* ===== LOWER THIRD ===== */
.card{position:relative;display:flex;align-items:center;font-family:var(--fn);color:var(--t);gap:28px;transform-style:flat}
.txt{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.nm{position:relative;font-size:48px;font-weight:800;line-height:1.1;white-space:nowrap;letter-spacing:.3px}
.rl{position:relative;font-family:var(--fr);font-size:28px;font-weight:500;color:var(--st);white-space:nowrap;margin-top:6px;display:flex;align-items:center;gap:10px}
.ex{font-family:var(--fr);font-size:22px;opacity:.88;margin-top:4px;white-space:nowrap}
.oi{display:inline-flex;width:1em;height:1em;color:var(--a);flex:none}.oi svg{width:100%;height:100%}
.lgb{flex:none;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.lgb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.card.lg-right{flex-direction:row-reverse}
.up .nm{text-transform:uppercase}

.L-glass3d{padding:22px 48px;border-radius:20px;background:linear-gradient(135deg,rgba(var(--p-rgb),.94),rgba(var(--s-rgb),.95));box-shadow:0 34px 60px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -14px 30px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.22);transform:perspective(1400px) rotateY(var(--tilt)) rotateX(4deg)}
.L-glass3d::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:7px;border-radius:7px;background:var(--a);box-shadow:0 0 16px var(--a),0 0 40px rgba(var(--a-rgb),.7)}
.L-glass3d::after{content:'';position:absolute;left:0;right:0;top:0;height:50%;border-radius:20px 20px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);pointer-events:none}
.L-glass3d .rl{padding-top:8px;border-top:2px solid rgba(var(--a-rgb),.75)}
.L-glass3d .lgb{width:110px;height:110px;background:rgba(255,255,255,.1);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}

.L-neon{padding:20px 46px;border-radius:16px;background:rgba(6,8,18,.88);box-shadow:0 0 0 2px var(--a),0 0 22px rgba(var(--a-rgb),.9),0 0 60px rgba(var(--a-rgb),.45),inset 0 0 26px rgba(var(--a-rgb),.35);transform:perspective(1400px) rotateY(var(--tilt))}
.L-neon .nm{color:#fff;text-shadow:0 0 6px var(--a),0 0 18px var(--a)}
.L-neon .rl{color:var(--a)}
.L-neon .lgb{width:96px;height:96px}

.L-ribbon{gap:0;align-items:stretch;transform:perspective(1400px) rotateY(var(--tilt)) rotateX(6deg);filter:drop-shadow(0 18px 22px rgba(0,0,0,.5))}
.L-ribbon .lgb{width:130px;background:linear-gradient(160deg,var(--pl),var(--p) 55%,var(--pd));padding:14px;box-shadow:inset -8px 0 14px rgba(0,0,0,.3)}
.L-ribbon .nm{background:linear-gradient(90deg,var(--p),var(--s));padding:14px 76px 14px 34px;clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%)}
.L-ribbon .rl{margin-top:0;background:linear-gradient(90deg,var(--a),rgba(var(--a-rgb),.88));color:var(--on-a);font-weight:700;padding:8px 60px 8px 34px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.L-ribbon .rl .oi{color:var(--on-a)}
.L-ribbon .ex{margin-top:0;background:rgba(0,0,0,.65);padding:6px 40px 6px 34px;opacity:1}
.L-ribbon.lg-right .txt{align-items:flex-end}

.L-luxe{padding:24px 72px;gap:30px;background:linear-gradient(180deg,rgba(var(--s-rgb),.96),rgba(var(--p-rgb),.93));transform:perspective(1400px) rotateX(8deg);box-shadow:0 30px 50px -10px rgba(0,0,0,.6)}
.L-luxe::before,.L-luxe::after{content:'';position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--a),#fff,var(--a),transparent);box-shadow:0 0 14px rgba(var(--a-rgb),.8)}
.L-luxe::before{top:0}.L-luxe::after{bottom:0}
.L-luxe .txt{align-items:center;text-align:center}
.L-luxe .nm{font-weight:600;font-size:52px}
.L-luxe .rl{color:var(--a);text-transform:uppercase;letter-spacing:6px;font-size:22px;margin-top:10px}
.L-luxe .lgb{width:100px;height:100px;border:2px solid var(--a);border-radius:50%;padding:14px;box-shadow:0 0 18px rgba(var(--a-rgb),.6)}

.L-arabesque{padding:18px 56px 18px 34px;gap:30px;border-radius:0 46px 0 46px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 24px),repeating-linear-gradient(-45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 24px),linear-gradient(135deg,var(--p),var(--s));
  border:2px solid var(--a);box-shadow:0 0 0 6px rgba(var(--s-rgb),.9),0 0 0 8px rgba(var(--a-rgb),.7),0 30px 50px -8px rgba(0,0,0,.6);transform:perspective(1400px) rotateY(var(--tilt))}
.L-arabesque .lgb{width:108px;height:128px;border-radius:54px 54px 10px 10px;border:2px solid var(--a);background:rgba(0,0,0,.25);padding:16px 14px 12px}
.L-arabesque .rl{color:var(--a)}
.L-arabesque .nm{text-shadow:0 2px 0 rgba(0,0,0,.35)}

.L-float{--t:#1a1f2b;padding:0 46px 0 0;border-radius:18px;background:linear-gradient(180deg,#ffffff,#e9edf3);box-shadow:0 8px 0 var(--a),0 40px 60px -12px rgba(0,0,0,.55);transform:perspective(1400px) rotateY(var(--tilt))}
.L-float .txt{padding:20px 0}
.L-float .nm{color:var(--t)}
.L-float .rl{color:var(--p);font-weight:700}
.L-float .ex{color:#333}
.L-float .lgb{width:130px;align-self:stretch;min-height:120px;background:linear-gradient(160deg,var(--p),var(--s));border-radius:18px 0 0 18px;padding:16px}
.L-float.lg-right{padding:0 0 0 46px}.L-float.lg-right .lgb{border-radius:0 18px 18px 0}
.L-float.nolg{padding:0 46px}

.L-cube{padding:20px 46px;background:linear-gradient(135deg,var(--p),var(--s));border-radius:6px;transform:perspective(1400px) rotateY(var(--tilt)) rotateX(5deg);
  box-shadow:1px 1px 0 var(--pd),2px 2px 0 var(--pd),3px 3px 0 var(--pd),4px 4px 0 var(--pd),5px 5px 0 var(--pd),6px 6px 0 var(--pd),7px 7px 0 var(--pd),8px 8px 0 var(--pd),9px 9px 0 var(--pd),10px 10px 0 var(--pd),12px 12px 0 var(--a),32px 36px 40px rgba(0,0,0,.55)}
.L-cube .lgb{width:104px;height:104px;background:var(--a);padding:12px;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.L-cube .rl{color:var(--a);font-weight:700;text-transform:uppercase;letter-spacing:2px}

.L-metal{padding:20px 50px;border-radius:14px;background:linear-gradient(180deg,var(--pl) 0%,var(--p) 46%,var(--pd) 54%,var(--p) 100%);border:2px solid var(--a);transform:perspective(1400px) rotateX(10deg) rotateY(var(--tilt));
  box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -4px 6px rgba(0,0,0,.35),0 0 0 4px rgba(0,0,0,.35),0 26px 46px -8px rgba(0,0,0,.6)}
.L-metal .nm{text-shadow:0 2px 0 rgba(0,0,0,.45),0 -1px 0 rgba(255,255,255,.3)}
.L-metal .lgb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd5dc 40%,#7d858f);padding:16px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.4)}

.L-line{padding:16px 90px 16px 30px;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.4) 70%,transparent)}
.L-line.lg-right,.pos-right .L-line{background:linear-gradient(270deg,rgba(0,0,0,.7),rgba(0,0,0,.4) 70%,transparent);padding:16px 30px 16px 90px}
.L-line .nm{text-shadow:0 3px 12px rgba(0,0,0,.6);padding-bottom:10px}
.L-line .nm::after{content:'';position:absolute;left:0;right:-50px;bottom:0;height:3px;background:linear-gradient(90deg,var(--a),rgba(var(--a-rgb),0));box-shadow:0 0 14px var(--a)}
.L-line .lgb{width:96px;height:96px}

.L-capsule{padding:14px 58px 14px 14px;gap:24px;border-radius:999px;background:linear-gradient(180deg,var(--pl),var(--p) 50%,var(--pd));transform:perspective(1400px) rotateX(6deg);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.3),0 0 0 3px rgba(var(--a-rgb),.9),0 0 22px rgba(var(--a-rgb),.4),0 24px 40px -8px rgba(0,0,0,.55)}
.L-capsule::after{content:'';position:absolute;left:30px;right:30px;top:4px;height:44%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.L-capsule .lgb{width:96px;height:96px;border-radius:50%;background:#fff;padding:12px;box-shadow:0 0 0 3px var(--a)}
.L-capsule.lg-right{padding:14px 14px 14px 58px}
.L-capsule.nolg{padding:20px 58px}
.L-capsule .nm{font-size:42px}.L-capsule .rl{font-size:25px}

/* ===== TITLE ===== */
.tt{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--t);font-family:var(--ft);padding:44px 100px;min-width:900px;box-sizing:border-box}
.tt-logo img{max-height:130px;max-width:320px;display:block;margin:0 auto 10px}
.tt-orn{color:var(--a);width:72px;height:72px;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(var(--a-rgb),.6))}.tt-orn svg{width:100%;height:100%}
.tt-ar{font-family:var(--far);font-size:48px;color:var(--a);direction:rtl;line-height:1.7;margin-bottom:4px}
.tt-eb{font-family:var(--fr);font-size:26px;letter-spacing:8px;text-transform:uppercase;color:var(--a);display:flex;align-items:center;gap:18px}
.tt-eb::before,.tt-eb::after{content:'';width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--a))}
.tt-eb::after{background:linear-gradient(270deg,transparent,var(--a))}
.tt-main{font-size:92px;font-weight:700;line-height:1.1;margin:10px 0;white-space:pre-line;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.tt-sub{font-family:var(--fn);font-size:38px;color:var(--st);font-weight:500;white-space:pre-line}
.tt-info{font-family:var(--fr);font-size:26px;margin-top:18px;padding:8px 28px;border:1px solid rgba(var(--a-rgb),.7);border-radius:999px;background:rgba(0,0,0,.18)}

.Ti-cinematic{background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,.25) 55%,transparent 72%);padding:70px 160px}
.Ti-cinematic::before,.Ti-cinematic::after{content:'';position:absolute;left:18%;right:18%;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);box-shadow:0 0 16px var(--a)}
.Ti-cinematic::before{top:24px}.Ti-cinematic::after{bottom:24px}
.Ti-cinematic .tt-main{text-shadow:0 6px 30px rgba(0,0,0,.8),0 0 40px rgba(var(--a-rgb),.35)}

.Ti-glass{border-radius:30px;background:linear-gradient(140deg,rgba(var(--p-rgb),.93),rgba(var(--s-rgb),.95));border:1px solid rgba(255,255,255,.25);transform:perspective(1600px) rotateX(8deg);
  box-shadow:0 50px 80px -20px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -20px 40px rgba(0,0,0,.25)}
.Ti-glass::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;border-radius:30px 30px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);pointer-events:none}
.Ti-glass::before{content:'';position:absolute;left:20%;right:20%;bottom:-3px;height:6px;border-radius:6px;background:var(--a);box-shadow:0 0 20px var(--a),0 0 50px rgba(var(--a-rgb),.7)}

<body>
<div id="stage"></div>
<script src="/utc/common.js"></script>
<script>
(function(){
const K = window.KLM;
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'pgm';                  // pgm = siaran, pvw = pratinjau panel kontrol
const ONLY = (Q.get('only') || 'lt,title,ticker,logo,loc,soc,oc').split(',');
if ((MODE === 'pvw' || Q.get('bg')) && !Q.get('t')) document.body.classList.add('pv');
addEventListener('message', e => { if (e.data && 'klmBg' in e.data) document.body.classList.toggle('pv', !!e.data.klmBg); });
document.getElementById('gf').href = K.FONT_URL;
const stage = document.getElementById('stage');

let SCALE = 1;
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080) || 1; SCALE = s; stage.style.transform = `scale(${s})`;
  stage.style.left = ((innerWidth - 1920*s)/2) + 'px'; stage.style.top = ((innerHeight - 1080*s)/2) + 'px'; }
addEventListener('resize', fit); fit();

// CSS pemetaan animasi
(function(){
  const bars = { lightWipe:'lightWipe', slideLight:'lightWipe' };
  const origin = { flip3d:'50% 100%', swing3d:'0 50%', cubeTurn:'50% 50% -80px', unfold:'50% 50%' };
  let css = '';
  K.ANIMS.forEach(a => {
    css += `.anim[data-a="${a.id}"].in .aw,.anim[data-a="${a.id}"].out .aw{animation-name:k_${a.id}${origin[a.id]?';transform-origin:'+origin[a.id]:''}}\n`;
    if (bars[a.id]) css += `.anim[data-a="${a.id}"].in .abar,.anim[data-a="${a.id}"].out .abar{display:block;animation-name:kb_${bars[a.id]}}\n`;
  });
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();

const SPARK_POS = [[4,-12],[28,92],[52,-18],[78,88],[97,8],[64,40],[16,58]];
function fxParts(light, solid){
  const L = light === 'combo' ? ['sweep','edge','sparkle'] : [light];
  let inside = '', outside = '';
  if (L.includes('sweep') && solid) inside += '<div class="fx"></div>';
  if (L.includes('edge')) inside += '<svg class="edge2" aria-hidden="true"><rect class="eg" pathLength="100" width="100%" height="100%"/><rect class="ec" pathLength="100" width="100%" height="100%"/></svg>';
  if (L.includes('flare')) inside += '<i class="flare"></i>';
  if (L.includes('sparkle')) outside += SPARK_POS.map((p,i)=>`<i class="sp" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${(i*0.37).toFixed(2)}s"></i>`).join('');

    const id = a.id;
    if (WHOLE[id]) css += `.oc-c[data-a="${id}"].ain{animation:ko_${id} var(--oin) cubic-bezier(.6,0,.2,1) both}.oc-c[data-a="${id}"].aout{animation:ko_${id} var(--oout) cubic-bezier(.6,0,.2,1) both reverse}\n`;
    else if (id === 'doors') {}
    else if (id === 'typeGlow') css += `.oc-c[data-a="typeGlow"].ain .oc-logo{animation:ko_logoPop var(--oin) cubic-bezier(.2,.8,.2,1) both}
.oc-c[data-a="typeGlow"].ain .oc-eb,.oc-c[data-a="typeGlow"].ain .oc-sub{animation:ko_fade var(--oin) ease both;animation-delay:calc(var(--oin) * .5)}
.oc-c[data-a="typeGlow"].ain .ch{animation:ko_ch .7s cubic-bezier(.2,.8,.2,1) both}
.oc-c[data-a="typeGlow"].aout .oc-box{animation:ko_blurReveal var(--oout) ease both reverse}\n`;
    else css += `.oc-c[data-a="${id}"].ain .oc-logo,.oc-c[data-a="${id}"].ain .oc-tx{animation:ko_${id} var(--oin) cubic-bezier(.2,.8,.2,1) both}
.oc-c[data-a="${id}"].ain .oc-tx{animation-delay:calc(var(--oin) * .18)}
.oc-c[data-a="${id}"].aout .oc-logo,.oc-c[data-a="${id}"].aout .oc-tx{animation:ko_${id} var(--oout) cubic-bezier(.6,0,.4,1) both reverse}\n`;
  });
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();
const OC = { node:null, key:'', tm:[], cfg:null, kind:'' };
const ocClear = () => { OC.tm.forEach(clearTimeout); OC.tm = []; };
function ocChars(c){
  let i = 0;
  const parts = String(c.title||'').split('\n').map(line => [...line].map(ch => `<span class="ch" style="animation-delay:calc(var(--oin) * .25 + ${(i++)*45}ms)">${ch===' '?'&nbsp;':esc(ch)}</span>`).join(''));
  const st = FS(c, 'title');
  return st ? `<span class="fmt-t" style="${st}">${parts.join('<br>')}</span>` : parts.join('<br>');
}
function ocVars(c){
  return `--ls:${Number(c.logoSize)||260}px;--osc:${Number(c.scale)||1};--oy:${Number(c.y)||0}px;--oin:${Math.max(200,Number(c.inDur)||1600)}ms;--oout:${Math.max(200,Number(c.outDur)||1000)}ms;--fit:${c.fit||'cover'};`;
}
function ocTexts(c){
  return `${c.eb?`<div class="oc-eb">${F(c,'eb',c.eb)}</div>`:''}<div class="oc-ti">${c.animIn==='typeGlow' ? ocChars(c) : F(c,'title',c.title)}</div>${c.sub?`<div class="oc-sub">${F(c,'sub',c.sub)}</div>`:''}`;
}
function ocHTML(S, ev, c){
  if (c.type === 'video' && c.video && c.video.url)
    return `<div class="oc oc-bg-black" style="${ocVars(c)}"><div class="oc-bgl"></div><video class="oc-vid" playsinline preload="auto" src="${esc(c.video.url)}"></video><div class="oc-black"></div></div>`;
  const th = ev.theme, url = logoUrl(S, c.logoId);
  const logo = url ? `<div class="oc-logo"><img src="${esc(url)}"></div>` : (th.orn && th.orn !== 'none' ? `<div class="oc-logo oc-orn">${ornSvg(th)}</div>` : '');
  const L = c.light === 'combo' ? ['rays','sparkle','shimmer','glow'] : [c.light];
  let lights = '';
  if (L.includes('rays')) lights += '<div class="oc-rays"></div>';
  if (L.includes('glow')) lights += '<div class="oc-glow"></div>';
  if (L.includes('sparkle')) lights += [[22,30],[78,26],[34,72],[70,70],[50,16],[14,56],[86,58],[58,84]].map((p,i)=>`<i class="sp" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${(i*.33).toFixed(2)}s"></i>`).join('');
  return `<div class="oc oc-bg-${c.bg||'theme'} ocl-${c.light} ${c.animIn==='typeGlow'?'tg':''}" style="${ocVars(c)}"><div class="oc-bgl"></div>${lights}
    <div class="oc-c OL-${c.layout||'center'}"><div class="oc-box">${logo}<div class="oc-tx">${ocTexts(c)}</div></div></div>
    <div class="oc-door l"></div><div class="oc-door r"></div><div class="oc-black"></div></div>`;
}
function ocInTime(c){
  const d = Math.max(200, Number(c.inDur)||1600);
  if (c.animIn === 'typeGlow') return d * .25 + [...String(c.title||'')].length * 45 + 700;
  if (c.animIn === 'portal' || c.animIn === 'curtain' || c.animIn === 'lightSweep' || c.animIn === 'doors') return d;
  return d * 1.18;
}
function ocReport(w){
  if (w.preview || MODE === 'pvw') return;
  fetch('/utc/api/oc/end', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ ev: w.ev, run: w.run, kind: w.kind }) }).catch(()=>{});
}
function ocShow(S, ev, w){
  const c = w.cfg, wrap = document.createElement('div');
  wrap.innerHTML = ocHTML(S, ev, c);
  const n = wrap.firstElementChild; stage.appendChild(n);
  OC.node = n; OC.cfg = c; OC.kind = w.kind;
  const box = n.querySelector('.oc-c'), vid = n.querySelector('video');
  const finish = () => {
    if (OC.node !== n) return;
    if (w.kind === 'closing'){ n.classList.add('black'); ocReport(w); }
    else { ocReport(w); if (w.preview && c.autoOff !== false) OC.tm.push(setTimeout(()=>{ if (OC.node === n) ocHide(); }, 300)); }
  };
  if (w.done){                                   // sudah selesai sebelumnya (mis. sumber OBS dimuat ulang)
    n.classList.add('show', 'instant');
    if (w.kind === 'closing') n.classList.add('black');
    else if (vid){ vid.addEventListener('loadedmetadata', () => { try { vid.currentTime = Math.max(0, vid.duration - .05); } catch(e){} }, { once:true }); }
    return;
  }
  requestAnimationFrame(() => n.classList.add('show'));
  if (vid){
    vid.muted = MODE === 'pvw' || !c.sound;
    vid.volume = Math.max(0, Math.min(1, (Number(c.volume) || 0) / 100));
    vid.addEventListener('ended', finish);
    vid.addEventListener('error', () => OC.tm.push(setTimeout(finish, 1500)));
    const p = vid.play(); if (p) p.catch(() => { vid.muted = true; vid.play().catch(()=>{}); });
    return;
  }
  if (c.animIn === 'doors'){ n.dataset.doors = '1'; n.classList.add('din'); }
  else { box.dataset.a = c.animIn; box.classList.add('ain'); }
  const outNeeded = !(w.kind === 'opening' && c.autoOff === false);
  OC.tm.push(setTimeout(() => {
    if (OC.node !== n) return;
    if (!outNeeded){ finish(); return; }
    ocOut(n, c, () => { box.style.visibility = 'hidden'; finish(); });
  }, ocInTime(c) + Math.max(0, Number(c.hold)||0) * 1000));
}
function ocOut(n, c, done){
  const box = n.querySelector('.oc-c');
  n.classList.remove('din');
  if (c.animOut === 'doors'){ n.dataset.doors = '1'; void n.offsetWidth; n.classList.add('dout'); }
  else { n.dataset.doors = '0'; box.dataset.a = c.animOut; box.classList.remove('ain'); void box.offsetWidth; box.classList.add('aout'); }
  OC.tm.push(setTimeout(done, Math.max(200, Number(c.outDur)||1000)));
}
function ocHide(){
  const n = OC.node; if (!n) return;
  OC.node = null; ocClear();
  const c = OC.cfg || {}, box = n.querySelector('.oc-c'), vid = n.querySelector('video');
  const gone = () => { n.classList.add('leaving'); setTimeout(() => { if (vid) try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch(e){} n.remove(); }, 850); };
  if (box && box.style.visibility !== 'hidden' && !n.classList.contains('black') && !vid){
    const t = []; OC.tm = t;
    ocOut(n, c, gone); OC.tm = [];
  } else gone();
}
function ocKeyOf(w){
  if (!w) return '';
  const c = w.cfg;
  return [w.kind, w.run, c.type, c.layout, c.bg, c.light, c.animIn, c.animOut, c.inDur, c.hold, c.outDur, c.autoOff, c.logoId, c.video && c.video.url, c.fit, c.sound].join('|');
}
function ocUpdate(S, ev, w){
  const key = ocKeyOf(w);
  if (!w){ if (OC.node) ocHide(); OC.key = ''; return; }
  if (key === OC.key && OC.node){
    // run sama: perbarui tulisan / ukuran / posisi tanpa mengulang animasi
    const n = OC.node, c = w.cfg; OC.cfg = c;
    n.setAttribute('style', ocVars(c));
    const tx = n.querySelector('.oc-tx'); if (tx){ const h = ocTexts(c); if (tx._h !== h){ tx.innerHTML = h; tx._h = h; } }
    const v = n.querySelector('video'); if (v){ v.muted = MODE === 'pvw' || !c.sound; v.volume = Math.max(0, Math.min(1, (Number(c.volume)||0)/100)); }
    if (w.kind === 'closing' && w.done) n.classList.add('black');
    return;
  }
  if (key === OC.key && !OC.node && w.done !== true) return;
  if (OC.node){ const old = OC.node; OC.node = null; ocClear(); old.classList.add('leaving'); setTimeout(() => old.remove(), 850); }
  OC.key = key;
  ocShow(S, ev, w);
}

function render(S, force){
  if (!S || !S.events) { Object.values(L).forEach(l=>l.update(null)); ocUpdate(null, null, null); return; }
  const ev = S.events[S.eventType]; if (!ev) { Object.values(L).forEach(l=>l.update(null)); ocUpdate(null, null, null); return; }
  K.upgradeEvent(S.eventType, ev);
  const vars = K.themeVars(ev.theme);
  const vk = JSON.stringify(vars);
  if (stage._vk !== vk){ for (const k in vars) stage.style.setProperty(k, vars[k]); stage._vk = vk; }
  const want = f => ONLY.includes(f);

  // opening / closing: saat tampil, grafis lain ditutup sementara (status ON/OFF-nya tidak diubah)
  const oc = ev.oc;
  let ocW = null;
  if (force){ if (force.oc && oc && oc[force.oc]) ocW = { kind: force.oc, cfg: oc[force.oc], run: 'pv' + (force.n || 0), preview: true }; }
  else if (oc && oc.active && oc[oc.active]) ocW = { kind: oc.active, cfg: oc[oc.active], run: oc.run, done: !!oc.done, ev: S.eventType };
  const cover = !!ocW;
  ocUpdate(S, ev, want('oc') ? ocW : null);
  if (cover){ Object.values(L).forEach(l=>l.update(null)); return; }

  // lokasi
  let gW = null;
  const gId = force ? force.loc : (ev.loc && ev.loc.visible ? ev.loc.activeId : null);
  const gItem = gId && ev.loc && ev.loc.items.find(x=>x.id===gId);
  if (want('loc') && gItem){ gW = buildLoc(S, ev, gItem); gW.sig = 'loc' + gItem.id + (force && force.n || ''); }
  L.loc.update(gW);

  // sosial media
  let sW = null;
  if (want('soc') && ev.soc){
    const sc = ev.soc, tkOnS = force ? !!force.tk : !!(ev.tk && ev.tk.visible);
    const fid = force ? force.soc : (sc.visible ? sc.activeId : null);
    if (force ? !!force.soc : sc.visible){
      sW = buildSoc(S, ev, fid, tkOnS && (ev.tk.items||[]).some(x=>x.on && String(x.text||'').trim()));
      if (sW) sW.sig += (force && force.n || '');
    }
  }
  L.soc.update(sW);

  // running text
  let tkW = null;
  const tkOn = force ? !!force.tk : ev.tk.visible;
  if (want('ticker') && tkOn) { tkW = buildTK(S, ev); if (tkW) tkW.sig = 'tk' + (force && force.n || ''); }
  L.tk.update(tkW);

  // lower third
  let ltW = null;
  const ltWants = {};
  if (ev.lt.multi){
    // banyak sekaligus: tiap lower third yang ON tampil di posisinya sendiri
    if (want('lt')){
      const its = ev.lt.items;
      const list = force ? (force.lt ? its.filter(x => x.on || x.id === force.lt) : []) : (ev.lt.visible ? its.filter(x => x.on) : []);
      list.forEach(it => {
        const i = its.indexOf(it), w = buildLT(S, ev, it, !!(tkOn && tkW), Object.assign(K.ltPos(i), it.p || {}));
        w.sig = 'lt' + it.id + (force && force.n || ''); ltWants['lt:' + it.id] = w;
      });
    }
  } else {
    const ltId = force ? force.lt : (ev.lt.visible ? ev.lt.activeId : null);
    const ltItem = ltId && ev.lt.items.find(x=>x.id===ltId);
    if (want('lt') && ltItem){ ltW = buildLT(S, ev, ltItem, !!(tkOn && tkW)); ltW.sig = 'lt' + ltItem.id + (force && force.n || ''); }
  }
  L.lt.update(ltW);
  multiUpdate('lt:', ltWants);

  // title
  let ttW = null;
  const ttId = force ? force.tt : (ev.tt.visible ? ev.tt.activeId : null);
  const ttItem = ttId && ev.tt.items.find(x=>x.id===ttId);
  if (want('title') && ttItem){ ttW = buildTT(S, ev, ttItem); ttW.sig = 'tt' + ttItem.id + (force && force.n || ''); }
  L.tt.update(ttW);

  // logo pojok (bisa lebih dari satu, masing-masing posisinya sendiri)
  const bgWants = {};
  const bgOn = force ? !!force.bug : ev.bug.visible;
  if (want('logo') && bgOn) (ev.bug.items || []).forEach(it => {
    if (it.on === false && !(force && force.bugSel === it.id)) return;
    const w = buildBug(S, ev, it); if (w){ w.sig = 'bug' + it.id + (force && force.n || ''); bgWants['bug:' + it.id] = w; }
  });
  multiUpdate('bug:', bgWants);
}

if (MODE === 'pvw'){
  // ---- geser manual elemen di Preview (mouse / jari) ----
  document.body.classList.add('dragok');
  let drag = null;
  const post = (phase, e) => parent.postMessage({ klmDrag: { l: drag.l, phase, tx: (e.clientX - drag.x) / SCALE, ty: (e.clientY - drag.y) / SCALE } }, '*');
  stage.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const n = e.target.closest('.anim'); if (!n) return;
    const l = Object.keys(L).find(k => L[k].node === n); if (!l) return;
    e.preventDefault();
    drag = { l, n, x: e.clientX, y: e.clientY, id: e.pointerId };
    n._drag = true; n.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    post('start', e);
  });
  stage.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) post('move', e); });
  const up = e => { if (!drag || e.pointerId !== drag.id) return; post('end', e); drag.n._drag = false; drag.n.classList.remove('dragging'); drag = null; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  addEventListener('message', e => { const d = e.data || {}; if (d.klm) render(d.state, d.force); });
  parent.postMessage({ klmPvwReady: true }, '*');
} else {
  let es;
  const connect = () => {
    es = new EventSource('/utc/events');
    es.onmessage = e => { try { const d = JSON.parse(e.data); render(d.state, null); } catch(err){ console.error(err); } };
    es.onerror = () => { es.close(); setTimeout(connect, 1500); };
  };
  connect();
}
})();
</script>
</body>
